<!-- CONCEPT C: BATCH HUB — inbox lô + workspace từng lô -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Hub — Put-to-Light · Kho HCM-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Be Vietnam Pro: hỗ trợ tiếng Việt đầy đủ; JetBrains Mono cho mã/số -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1217;
    --surface:#161b22;
    --surface-2:#1b212b;
    --surface-3:#202836;
    --border:#262d38;
    --border-soft:#202732;
    --text:#e8ecf3;
    --text-2:#9aa6b5;
    --text-3:#5d6b7d;
    --accent:#7c6cff;
    --accent-soft:rgba(124,108,255,.12);
    --accent-border:rgba(124,108,255,.36);
    --amber:#ffb01f;
    --green:#3fb950;
    --green-soft:rgba(63,185,80,.12);
    --red:#f0564a;
    --red-soft:rgba(240,86,74,.12);
    --mono:'JetBrains Mono',monospace;
    --sans:'Be Vietnam Pro',system-ui,sans-serif;
    --r-sm:10px; --r-md:12px; --r-lg:14px;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-lift:0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.32);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{color-scheme:dark}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:13px;line-height:1.5;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(800px 320px at 18% -8%, rgba(124,108,255,.07), transparent 60%),
      radial-gradient(700px 300px at 90% -10%, rgba(63,150,255,.04), transparent 60%);
  }
  ::selection{background:rgba(124,108,255,.35)}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .mono{font-family:var(--mono)}

  /* ============ Topbar ============ */
  .topbar{
    position:sticky;top:0;z-index:50;height:52px;
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:rgba(15,18,23,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border-soft);
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
  .logo-mark{
    width:24px;height:24px;border-radius:7px;flex:none;
    background:linear-gradient(135deg,#8d7dff,#5b4be0);
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(124,108,255,.4);
  }
  .logo-mark svg{display:block}
  .crumb{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12.5px;min-width:0}
  .crumb .sep{opacity:.55}
  .crumb .cur{color:var(--text-2);font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb button.root{color:var(--text-3);transition:color .15s}
  .crumb button.root:hover{color:var(--text)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .ghost-link{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
    border:1px solid var(--border);border-radius:8px;color:var(--text-2);
    font-size:12px;text-decoration:none;transition:border-color .15s,color .15s,background .15s;
  }
  .ghost-link:hover{border-color:#37404e;color:var(--text);background:var(--surface)}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,#3c4658,#252c38);
    border:1px solid #38404e;display:grid;place-items:center;
    font-size:10.5px;font-weight:600;color:#c4ccda;letter-spacing:.02em;
  }

  /* ============ Layout ============ */
  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:30px 22px 64px}
  .screen{display:none}
  .screen.on{display:block;animation:fadeUp .22s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ============ Inbox ============ */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  h1{font-size:19px;font-weight:600;letter-spacing:-.015em}
  .page-sub{color:var(--text-3);font-size:12.5px;margin-top:3px}
  .kbd-hint{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:11.5px}
  kbd{
    font-family:var(--mono);font-size:10.5px;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;
  }
  .chips{display:flex;gap:6px;margin-bottom:14px}
  .chip{
    height:27px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--text-2);
    border:1px solid var(--border);background:transparent;
    display:inline-flex;align-items:center;gap:7px;transition:all .15s;
  }
  .chip:hover{color:var(--text);border-color:#37404e}
  .chip.on{color:#cfc9ff;background:var(--accent-soft);border-color:var(--accent-border)}
  .chip .n{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .chip.on .n{color:#a89dff}

  .inbox-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    overflow:hidden;box-shadow:var(--shadow);
  }
  .inbox-head{
    display:grid;grid-template-columns:230px 92px 1fr 168px 26px;gap:14px;align-items:center;
    padding:9px 18px;border-bottom:1px solid var(--border-soft);
    font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  }
  .brow{
    display:grid;grid-template-columns:230px 92px 1fr 168px 26px;gap:14px;align-items:center;
    padding:13px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;
    transition:background .14s,box-shadow .14s,transform .14s;position:relative;
  }
  .brow:last-child{border-bottom:none}
  .brow:hover,.brow.sel{background:var(--surface-2)}
  .brow:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px #2b3340,0 6px 18px rgba(0,0,0,.28);z-index:2;border-radius:8px}
  .brow.sel{box-shadow:inset 2px 0 0 var(--accent)}
  .brow .code{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text)}
  .brow .date{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
  .brow .meta{color:var(--text-2);font-size:12.5px;display:flex;align-items:center;gap:8px;min-width:0}
  .brow .meta .dv{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex:none}
  .brow .chev{color:var(--text-3);display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .brow .enter-hint{
    opacity:0;transition:opacity .15s;font-family:var(--mono);font-size:10px;color:var(--text-3);
    border:1px solid var(--border);border-radius:4px;padding:0 4px;white-space:nowrap;
  }
  .brow:hover .enter-hint,.brow.sel .enter-hint{opacity:1}
  .row-prog{height:3px;width:64px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:5px}
  .row-prog i{display:block;height:100%;background:var(--accent);border-radius:2px}

  .badge{
    display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;
    border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;
    border:1px solid var(--border);color:var(--text-2);background:var(--surface-2);justify-self:start;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--text-3)}
  .badge.b-cho-du-lieu .dot{background:var(--text-3)}
  .badge.b-cho-duyet{color:#d8c79a;border-color:rgba(255,176,31,.25);background:rgba(255,176,31,.07)}
  .badge.b-cho-duyet .dot{background:var(--amber)}
  .badge.b-san-sang{color:#bdb3ff;border-color:var(--accent-border);background:var(--accent-soft)}
  .badge.b-san-sang .dot{background:var(--accent)}
  .badge.b-dang-chay{color:#bdb3ff;border-color:var(--accent-border);background:var(--accent-soft)}
  .badge.b-dang-chay .dot{background:var(--accent);animation:blink 1.4s ease infinite}
  .badge.b-hoan-tat{color:#8fd49a;border-color:rgba(63,185,80,.3);background:var(--green-soft)}
  .badge.b-hoan-tat .dot{background:var(--green)}
  .badge.b-su-co{color:#f3a09a;border-color:rgba(240,86,74,.32);background:var(--red-soft)}
  .badge.b-su-co .dot{background:var(--red);animation:blink 1s ease infinite}
  @keyframes blink{50%{opacity:.35}}

  /* ============ Workspace ============ */
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px;
    margin-bottom:14px;transition:color .15s;
  }
  .back-link:hover{color:var(--text)}
  .ws-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .ws-code{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .ws-meta{color:var(--text-3);font-size:12px;margin-top:2px}
  .ws-head .grow{flex:1}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:500;
    transition:all .15s;white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(180deg,#8a7bff,#6f5ef5);color:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(124,108,255,.3),inset 0 1px 0 rgba(255,255,255,.14);
  }
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn-ghost{border:1px solid var(--border);color:var(--text-2);background:var(--surface)}
  .btn-ghost:hover{color:var(--text);border-color:#39424f;background:var(--surface-2)}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .btn-sm{height:27px;padding:0 11px;font-size:12px;border-radius:8px}
  .btn-danger-ghost{border:1px solid rgba(240,86,74,.35);color:#f3a09a;background:var(--red-soft)}
  .btn-danger-ghost:hover{background:rgba(240,86,74,.18)}
  .spin{
    width:13px;height:13px;border-radius:50%;flex:none;
    border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .7s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}

  /* segmented tabs */
  .stages{
    display:inline-flex;gap:3px;padding:3px;margin-bottom:20px;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
  }
  .stage-tab{
    display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;
    border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text-2);
    transition:all .15s;position:relative;
  }
  .stage-tab:hover:not(.lock):not(.on){color:var(--text);background:var(--surface-2)}
  .stage-tab.on{color:#fff;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--accent-border),0 1px 4px rgba(0,0,0,.3)}
  .stage-tab.lock{opacity:.38;cursor:not-allowed}
  .stage-tab .ix{
    font-family:var(--mono);font-size:10px;width:16px;height:16px;border-radius:5px;
    display:grid;place-items:center;background:var(--surface-3);color:var(--text-3);
    border:1px solid var(--border);flex:none;
  }
  .stage-tab.on .ix{background:var(--accent);border-color:transparent;color:#fff}
  .stage-tab.done .ix{background:var(--green-soft);border-color:rgba(63,185,80,.35);color:var(--green)}
  .stage-arrow{align-self:center;color:var(--text-3);font-size:11px;padding:0 2px;user-select:none}

  /* tooltip */
  [data-tip]{position:relative}
  [data-tip]:hover::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:#242b37;border:1px solid #333d4c;color:var(--text);font-size:11px;font-weight:400;
    padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:60;box-shadow:var(--shadow);
    pointer-events:none;animation:tipIn .12s ease;
  }
  @keyframes tipIn{from{opacity:0;transform:translate(-50%,3px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ============ Cards / panels ============ */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--shadow);
  }
  .card-h{
    display:flex;align-items:center;gap:10px;padding:13px 18px;
    border-bottom:1px solid var(--border-soft);
  }
  .card-h .t{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
  .card-h .s{color:var(--text-3);font-size:11.5px;margin-left:auto}
  .card-b{padding:18px}
  .panel{animation:fadeUp .2s ease}

  /* --- Tab Dữ liệu --- */
  .src-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .src-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    padding:16px 18px;display:flex;gap:13px;align-items:flex-start;transition:border-color .15s;
  }
  .src-card.ok{border-color:rgba(63,185,80,.3)}
  .src-ic{
    width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--accent-soft);border:1px solid var(--accent-border);color:#a89dff;
  }
  .src-card.ok .src-ic{background:var(--green-soft);border-color:rgba(63,185,80,.35);color:var(--green)}
  .src-name{font-weight:600;font-size:13px}
  .src-ep{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:2px}
  .src-state{font-size:11.5px;margin-top:7px;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .src-state.ok{color:var(--green)}

  /* --- Tab Kế hoạch --- */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-3);padding:9px 18px;border-bottom:1px solid var(--border-soft);
  }
  td{padding:10px 18px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px}
  .sku-code{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .pill{
    display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;border-radius:999px;
    font-size:11px;font-weight:500;
  }
  .pill .dot{width:5px;height:5px;border-radius:50%}
  .pill.ok{color:#8fd49a;background:var(--green-soft)} .pill.ok .dot{background:var(--green)}
  .pill.short{color:#f3a09a;background:var(--red-soft)} .pill.short .dot{background:var(--red)}
  .pill.over{color:#d8c79a;background:rgba(255,176,31,.09)} .pill.over .dot{background:var(--amber)}

  .plan-foot{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--border-soft)}
  .plan-note{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:7px}
  .plan-note .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}

  /* --- Tab Vận hành --- */
  .ops-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  .issue-banner{
    display:flex;align-items:center;gap:11px;padding:11px 16px;margin-bottom:14px;
    background:var(--red-soft);border:1px solid rgba(240,86,74,.32);border-radius:var(--r-md);
    font-size:12.5px;color:#f5b5af;
  }
  .issue-banner .x{color:var(--red);font-weight:700}
  .issue-banner .grow{flex:1}

  .zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .zone{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
    padding:13px 14px;transition:border-color .2s,box-shadow .2s;
  }
  .zone.live{border-color:var(--accent-border);box-shadow:0 0 0 1px var(--accent-border),0 6px 20px rgba(124,108,255,.12)}
  .zone-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .zone-name{font-size:12px;font-weight:600}
  .worker-chip{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-3);
    border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:var(--surface);
  }
  .worker-chip .wid{font-family:var(--mono);font-size:9.5px}
  .zone.live .worker-chip{color:#bdb3ff;border-color:var(--accent-border)}
  .rack{margin-bottom:9px}
  .rack:last-child{margin-bottom:0}
  .rack-lbl{font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-bottom:4px;letter-spacing:.06em}
  .rgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
  .cell{
    aspect-ratio:1;border-radius:4px;background:var(--surface-3);border:1px solid #2a3240;
    display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--text-3);
    position:relative;transition:all .15s;min-width:0;
  }
  .cell.bin{background:#27303f;border-color:#39455a;color:var(--text-2);font-weight:600;font-size:10px}
  .cell.lit{
    background:rgba(255,176,31,.18);border-color:var(--amber);color:#ffd47e;cursor:pointer;
    box-shadow:0 0 10px rgba(255,176,31,.45),inset 0 0 6px rgba(255,176,31,.2);
    animation:glow 1.1s ease infinite;
  }
  .cell.lit:hover{transform:scale(1.12);z-index:3}
  @keyframes glow{50%{box-shadow:0 0 16px rgba(255,176,31,.75),inset 0 0 8px rgba(255,176,31,.35)}}
  .cell.ok-bin{background:var(--green-soft);border-color:rgba(63,185,80,.55);color:var(--green);box-shadow:0 0 8px rgba(63,185,80,.25)}
  .cell .q{
    position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
    background:var(--amber);color:#1a1205;font-size:9px;font-weight:700;display:grid;place-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }

  .scan-bar{
    display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);flex-wrap:wrap;
  }
  .scan-state{font-size:12px;color:var(--text-2);flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
  .scan-state .mono{font-size:11px}
  .scan-state .okc{color:var(--green)}

  .prog-num{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
  .prog-num small{font-size:12px;color:var(--text-3);font-weight:400}
  .prog-row{display:flex;gap:22px;margin-bottom:13px}
  .prog-lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:3px}
  .pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:4px 0 14px}
  .pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6f5ef5,#9a8dff);transition:width .35s ease}
  .cur-task{
    font-size:12px;color:var(--text-2);padding:9px 12px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--border);margin-bottom:13px;
  }
  .cur-task b{color:var(--text);font-weight:600}
  .store-rows{display:grid;gap:5px}
  .store-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2)}
  .store-row .sq{
    width:18px;height:18px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);
    display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--text-2);flex:none;
  }
  .store-row .bar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
  .store-row .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
  .store-row .v{font-family:var(--mono);font-size:10.5px;color:var(--text-3);width:58px;text-align:right}

  .feed{max-height:252px;overflow-y:auto;display:grid;gap:1px}
  .feed::-webkit-scrollbar{width:8px}
  .feed::-webkit-scrollbar-thumb{background:#2b3340;border-radius:4px}
  .fitem{display:flex;gap:9px;padding:6px 4px;font-size:11.5px;color:var(--text-2);align-items:baseline;animation:fadeUp .2s ease}
  .fitem .ft{font-family:var(--mono);font-size:10px;color:var(--text-3);flex:none;width:52px}
  .fitem .fd{width:6px;height:6px;border-radius:50%;flex:none;align-self:center;background:var(--text-3)}
  .fitem.f-amber .fd{background:var(--amber)} .fitem.f-green .fd{background:var(--green)}
  .fitem.f-accent .fd{background:var(--accent)} .fitem.f-red .fd{background:var(--red)}
  .fitem.f-red{color:#f3a09a}
  .feed-empty{color:var(--text-3);font-size:12px;padding:14px 4px;text-align:center}

  /* --- Tab Biên bản --- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;
  }
  .stat .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
  .stat .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em}
  .stat .v small{font-size:12px;color:var(--text-3);font-weight:400}
  .stat .v.red{color:var(--red)} .stat .v.green{color:var(--green)}

  /* toast */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);opacity:0;z-index:80;
    background:#222a36;border:1px solid #364050;border-radius:10px;padding:9px 16px;
    font-size:12.5px;color:var(--text);box-shadow:var(--shadow-lift);
    display:flex;align-items:center;gap:9px;pointer-events:none;
    transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .td{width:7px;height:7px;border-radius:50%;background:var(--green)}

  @media (min-width:1500px){.wrap{max-width:1400px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-mark">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="1" y="1" width="4.2" height="4.2" rx="1.2" fill="#fff" opacity=".95"/>
        <rect x="6.8" y="1" width="4.2" height="4.2" rx="1.2" fill="#fff" opacity=".45"/>
        <rect x="1" y="6.8" width="4.2" height="4.2" rx="1.2" fill="#fff" opacity=".45"/>
        <rect x="6.8" y="6.8" width="4.2" height="4.2" rx="1.2" fill="#fff" opacity=".95"/>
      </svg>
    </span>
    LightSort
  </div>
  <nav class="crumb" id="crumb">
    <button class="root" id="crumbRoot">Kho HCM-01</button>
  </nav>
  <div class="topbar-right">
    <a class="ghost-link" href="./index.html">&#8592; Các concept khác</a>
    <div class="avatar" title="Nguyễn Quản Kho — Trưởng ca">NQ</div>
  </div>
</header>

<div class="wrap">

  <!-- ============ MÀN 1: INBOX LÔ ============ -->
  <section class="screen on" id="scrInbox">
    <div class="page-head">
      <div>
        <h1>Inbox lô</h1>
        <div class="page-sub" id="inboxSub"></div>
      </div>
      <div class="kbd-hint"><kbd>&#8593;</kbd><kbd>&#8595;</kbd> chọn lô &nbsp;·&nbsp; <kbd>&#9166;</kbd> mở lô</div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="inbox-card">
      <div class="inbox-head">
        <span>Mã lô</span><span>Ngày</span><span>Nội dung</span><span>Trạng thái</span><span></span>
      </div>
      <div id="batchList"></div>
    </div>
  </section>

  <!-- ============ MÀN 2: WORKSPACE CỦA LÔ ============ -->
  <section class="screen" id="scrWs">
    <button class="back-link" id="backBtn">&#8592; Inbox lô &nbsp;<kbd>Esc</kbd></button>
    <div class="ws-head">
      <div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="ws-code" id="wsCode"></span>
          <span id="wsBadge"></span>
        </div>
        <div class="ws-meta" id="wsMeta"></div>
      </div>
      <div class="grow"></div>
      <div id="wsAction"></div>
    </div>
    <div class="stages" id="stages"></div>
    <div id="panel"></div>
  </section>

</div>

<div class="toast" id="toast"><span class="td"></span><span id="toastTxt"></span></div>

<script>
'use strict';
/* =====================================================================
   BATCH HUB — máy trạng thái
   Pipeline mỗi lô:  Dữ liệu → Kế hoạch → Vận hành → Biên bản
   ===================================================================== */

/* ---------- Dữ liệu demo ---------- */
const STORES = ['A','B','C','D','E'];
const ZONES = {
  A:{label:'Khu A', stores:['A','B','C'], worker:{name:'Trần Thị B', id:'NV-2207'}},
  B:{label:'Khu B', stores:['D','E'],     worker:{name:'Lê Văn C',  id:'NV-3104'}}
};
/* Vị trí bin cửa hàng trên mini-map: [khu, kệ(0-1), tầng(1-3), ngăn(0-5)] */
const BIN_POS = {
  A:{zone:'A',rack:0,level:2,slot:1},
  B:{zone:'A',rack:0,level:1,slot:4},
  C:{zone:'A',rack:1,level:3,slot:2},
  D:{zone:'B',rack:0,level:2,slot:3},
  E:{zone:'B',rack:1,level:1,slot:1}
};
/* 8 SKU — alloc = phân bổ THỰC TẾ theo tồn (đã trừ thiếu); plan = kế hoạch gốc */
const SKUS = [
  {name:'Áo thun trắng M',  code:'SKU-1001', stock:64, plan:50, alloc:{A:12,B:10,C:10,D:8, E:10}},
  {name:'Quần jean xanh 30',code:'SKU-1002', stock:40, plan:40, alloc:{A:8, B:8, C:8, D:8, E:8 }},
  {name:'Giày thể thao 42', code:'SKU-1003', stock:18, plan:25, alloc:{A:4, B:4, C:4, D:3, E:3 }},
  {name:'Túi xách da',      code:'SKU-1004', stock:20, plan:20, alloc:{A:4, B:4, C:4, D:4, E:4 }},
  {name:'Mũ snapback',      code:'SKU-1005', stock:30, plan:30, alloc:{A:6, B:6, C:6, D:6, E:6 }},
  {name:'Áo hoodie xám',    code:'SKU-1006', stock:36, plan:36, alloc:{A:8, B:7, C:7, D:7, E:7 }},
  {name:'Thắt lưng da',     code:'SKU-1007', stock:24, plan:24, alloc:{A:5, B:5, C:5, D:5, E:4 }},
  {name:'Ví da nam',        code:'SKU-1008', stock:10, plan:14, alloc:{A:2, B:2, C:2, D:2, E:2 }}
];
const allocSum   = s => Object.values(s.alloc).reduce((a,b)=>a+b,0);
const TOTAL_PLAN   = SKUS.reduce((a,s)=>a+s.plan,0);          /* 239 */
const TOTAL_ACTUAL = SKUS.reduce((a,s)=>a+allocSum(s),0);     /* 228 */
const zoneSum = (skuIdx,z) => ZONES[z].stores.reduce((a,st)=>a+(SKUS[skuIdx].alloc[st]||0),0);

const STATUS_META = {
  'cho-du-lieu':{label:'Chờ dữ liệu'},
  'cho-duyet'  :{label:'Chờ duyệt'},
  'san-sang'   :{label:'Sẵn sàng'},
  'dang-chay'  :{label:'Đang chạy'},
  'hoan-tat'   :{label:'Hoàn tất'},
  'su-co'      :{label:'Có sự cố'}
};

/* ---------- Khởi tạo state mỗi lô ---------- */
function freshOps(){
  return { skuIdx:0, phase:'idle', zonesLeft:['A','B'], activeZone:null,
           pendingBins:{}, doneBins:{}, perSkuDone:SKUS.map(()=>false),
           unitsDone:0, perStore:{A:0,B:0,C:0,D:0,E:0}, feed:[], auto:false, timer:null };
}
function feedSeed(o, t, cls, txt){ o.feed.unshift({t, cls, txt}); }
function seedFinishSku(o, i){
  o.perSkuDone[i] = true;
  STORES.forEach(st => { o.perStore[st] += SKUS[i].alloc[st]; });
  o.unitsDone += allocSum(SKUS[i]);
  o.skuIdx = i + 1;
}
function makeBatch(id, date, seed){
  const b = { id, date, dataReceived:false, receivedAt:null, planLocked:false,
              issue:null, ops:freshOps() };
  if (seed.data)  { b.dataReceived = true; b.receivedAt = seed.dataAt || '08:12:40'; }
  if (seed.plan)  b.planLocked = true;
  if (seed.run)   {
    seedFinishSku(b.ops,0); seedFinishSku(b.ops,1);
    /* SKU thứ 3: xong Khu A, còn Khu B → ~45% */
    o3(b.ops);
    feedSeed(b.ops,'09:02:11','accent','Bắt đầu vận hành lô — 2 nhân viên vào ca');
    feedSeed(b.ops,'09:08:46','green','✓ Hoàn tất SKU Áo thun trắng M (1/8)');
    feedSeed(b.ops,'09:15:20','green','✓ Hoàn tất SKU Quần jean xanh 30 (2/8)');
    feedSeed(b.ops,'09:18:03','amber','Quét SKU Giày thể thao 42 — sáng 3 bin Khu A');
    feedSeed(b.ops,'09:19:34','green','Khu A xong Giày thể thao 42 — chờ Khu B');
  }
  if (seed.done)  { SKUS.forEach((_,i)=>seedFinishSku(b.ops,i));
    feedSeed(b.ops,'10:41:55','green','✓ Lô hoàn tất — 228/239 đơn vị, thiếu 11'); }
  if (seed.issue) {
    seedFinishSku(b.ops,0); seedFinishSku(b.ops,1); seedFinishSku(b.ops,2);
    seedFinishSku(b.ops,3); seedFinishSku(b.ops,4);
    b.issue = 'Sai SKU quét tại Khu B — thùng SKU-1006 nhưng nhân viên quét SKU-1007';
    feedSeed(b.ops,'14:02:18','green','✓ Hoàn tất SKU Mũ snapback (5/8)');
    feedSeed(b.ops,'14:05:51','red','✗ Sai SKU tại Khu B — hệ thống khóa, chờ giám sát xác nhận');
  }
  return b;
}
function o3(o){ /* hoàn tất Khu A của SKU index 2 */
  o.skuIdx = 2; o.zonesLeft = ['B'];
  ZONES.A.stores.forEach(st => { o.perStore[st] += SKUS[2].alloc[st]; });
  o.unitsDone += zoneSum(2,'A');
}

const BATCHES = [
  makeBatch('BATCH-20260518-002','18/05/2026',{}),                       /* Chờ dữ liệu — lô chính */
  makeBatch('BATCH-20260518-003','18/05/2026',{data:1,dataAt:'08:12:40'}),/* Chờ duyệt */
  makeBatch('BATCH-20260518-001','18/05/2026',{data:1,plan:1,run:1,dataAt:'07:55:02'}), /* Đang chạy ~45% */
  makeBatch('BATCH-20260517-009','17/05/2026',{data:1,plan:1,dataAt:'16:20:11'}),        /* Sẵn sàng */
  makeBatch('BATCH-20260517-007','17/05/2026',{data:1,plan:1,issue:1,dataAt:'13:02:33'}),/* Có sự cố */
  makeBatch('BATCH-20260517-005','17/05/2026',{data:1,plan:1,done:1,dataAt:'09:10:08'})  /* Hoàn tất */
];

/* ---------- Trạng thái dẫn xuất ---------- */
const opsStarted  = b => b.ops.unitsDone > 0 || b.ops.phase !== 'idle';
const opsComplete = b => b.ops.perSkuDone.every(Boolean);
const pct = b => Math.round(b.ops.unitsDone / TOTAL_ACTUAL * 100);
function statusOf(b){
  if (b.issue)          return 'su-co';
  if (!b.dataReceived)  return 'cho-du-lieu';
  if (!b.planLocked)    return 'cho-duyet';
  if (opsComplete(b))   return 'hoan-tat';
  if (opsStarted(b))    return 'dang-chay';
  return 'san-sang';
}
function badgeHTML(b){
  const s = statusOf(b);
  let label = STATUS_META[s].label;
  if (s === 'dang-chay') label += ' · ' + pct(b) + '%';
  return `<span class="badge b-${s}"><span class="dot"></span>${label}</span>`;
}

/* ---------- Tiện ích ---------- */
const $ = id => document.getElementById(id);
const now = () => new Date().toTimeString().slice(0,8);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let toastTimer = null;
function toast(msg){
  $('toastTxt').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('toast').classList.remove('show'), 2400);
}
function feed(b, cls, txt){
  b.ops.feed.unshift({t:now(), cls, txt});
  if (b.ops.feed.length > 40) b.ops.feed.pop();
}

/* =====================================================================
   MÀN 1 — INBOX
   ===================================================================== */
let filter = 'all', selIdx = 0, view = 'inbox', curBatch = null, curTab = null;

const FILTERS = [
  {k:'all',  label:'Tất cả',    test:()=>true},
  {k:'run',  label:'Đang chạy', test:b=>statusOf(b)==='dang-chay'},
  {k:'wait', label:'Chờ xử lý', test:b=>['cho-du-lieu','cho-duyet','san-sang','su-co'].includes(statusOf(b))},
  {k:'done', label:'Hoàn tất',  test:b=>statusOf(b)==='hoan-tat'}
];
const visibleBatches = () => BATCHES.filter(FILTERS.find(f=>f.k===filter).test);

function renderChips(){
  $('chips').innerHTML = FILTERS.map(f=>{
    const n = BATCHES.filter(f.test).length;
    return `<button class="chip ${filter===f.k?'on':''}" data-f="${f.k}">${f.label}<span class="n">${n}</span></button>`;
  }).join('');
}
function renderInbox(){
  renderChips();
  const list = visibleBatches();
  if (selIdx >= list.length) selIdx = Math.max(0, list.length-1);
  $('inboxSub').textContent = `${BATCHES.length} lô trong ca · ${BATCHES.filter(b=>statusOf(b)==='dang-chay').length} đang chạy`;
  $('batchList').innerHTML = list.map((b,i)=>{
    const s = statusOf(b);
    const prog = s==='dang-chay'
      ? `<div class="row-prog"><i style="width:${pct(b)}%"></i></div>` : '';
    return `
    <div class="brow ${i===selIdx?'sel':''}" data-id="${b.id}" data-i="${i}">
      <div>
        <div class="code">${b.id}</div>${prog}
      </div>
      <span class="date">${b.date}</span>
      <span class="meta">8 SKU <span class="dv"></span> 5 cửa hàng <span class="dv"></span> ${TOTAL_PLAN} đơn vị</span>
      ${badgeHTML(b)}
      <span class="chev"><span class="enter-hint">⏎ mở lô</span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>`;
  }).join('') || `<div class="feed-empty" style="padding:28px">Không có lô nào khớp bộ lọc.</div>`;
}

$('chips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  filter = c.dataset.f; selIdx = 0; renderInbox();
});
$('batchList').addEventListener('click', e=>{
  const r = e.target.closest('.brow'); if(!r) return;
  openBatch(r.dataset.id);
});

/* =====================================================================
   MÀN 2 — WORKSPACE
   ===================================================================== */
const TABS = [
  {k:'data',   label:'Dữ liệu'},
  {k:'plan',   label:'Kế hoạch'},
  {k:'ops',    label:'Vận hành'},
  {k:'report', label:'Biên bản'}
];
function tabState(b, k){ /* 'done' | 'open' | 'lock' */
  if (k==='data')   return b.dataReceived ? 'done' : 'open';
  if (k==='plan')   return !b.dataReceived ? 'lock' : (b.planLocked ? 'done' : 'open');
  if (k==='ops')    return !b.planLocked ? 'lock' : (opsComplete(b) ? 'done' : 'open');
  if (k==='report') return opsComplete(b) ? 'open' : 'lock';
}
const LOCK_TIP = {
  plan:'Nhận dữ liệu trước khi lập kế hoạch',
  ops:'Chốt kế hoạch trước khi vận hành',
  report:'Hoàn tất vận hành để xem biên bản'
};
function defaultTab(b){
  const s = statusOf(b);
  if (s==='cho-du-lieu') return 'data';
  if (s==='cho-duyet')   return 'plan';
  if (s==='hoan-tat')    return 'report';
  return 'ops'; /* sẵn sàng / đang chạy / sự cố → vào thẳng Vận hành */
}

function openBatch(id){
  stopAuto();
  curBatch = BATCHES.find(b=>b.id===id);
  curTab = defaultTab(curBatch);
  view = 'ws';
  $('scrInbox').classList.remove('on');
  $('scrWs').classList.add('on');
  renderWs();
}
function backToInbox(){
  stopAuto();
  view = 'inbox'; curBatch = null;
  $('scrWs').classList.remove('on');
  $('scrInbox').classList.add('on');
  $('crumb').innerHTML = `<button class="root" id="crumbRoot">Kho HCM-01</button>`;
  bindCrumb();
  renderInbox();
}
$('backBtn').addEventListener('click', backToInbox);
function bindCrumb(){ const r=$('crumbRoot'); if(r) r.onclick = ()=>{ if(view==='ws') backToInbox(); }; }
bindCrumb();

function renderWs(){
  const b = curBatch; if(!b) return;
  $('crumb').innerHTML =
    `<button class="root" id="crumbRoot">Kho HCM-01</button>
     <span class="sep">/</span><span class="cur">Lô ${b.id}</span>`;
  bindCrumb();
  $('wsCode').textContent = b.id;
  $('wsBadge').innerHTML = badgeHTML(b);
  $('wsMeta').textContent = `Tạo ${b.date} · 8 SKU · 5 cửa hàng · ${TOTAL_PLAN} đơn vị kế hoạch · 2 nhân viên`;
  renderAction(b);
  renderTabs(b);
  renderPanel(b);
}

/* Nút hành động chính theo trạng thái */
function renderAction(b){
  const s = statusOf(b);
  const host = $('wsAction');
  const map = {
    'cho-du-lieu': `<button class="btn btn-primary" data-act="recv">Nhận dữ liệu</button>`,
    'cho-duyet'  : `<button class="btn btn-primary" data-act="lockplan">Chốt kế hoạch</button>`,
    'san-sang'   : `<button class="btn btn-primary" data-act="goops">Bắt đầu vận hành</button>`,
    'dang-chay'  : b.ops.auto
        ? `<button class="btn btn-ghost" data-act="autostop">❚❚&ensp;Dừng demo</button>`
        : `<button class="btn btn-primary" data-act="autorun">▸&ensp;Tự chạy demo</button>`,
    'hoan-tat'   : `<button class="btn btn-ghost" data-act="print">In phiếu</button>`,
    'su-co'      : `<button class="btn btn-danger-ghost" data-act="goops">Xem sự cố</button>`
  };
  host.innerHTML = map[s];
}
$('wsAction').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]'); if(!btn||!curBatch) return;
  const act = btn.dataset.act;
  if (act==='recv')     { switchTab('data'); receiveData(curBatch); }
  if (act==='lockplan') { switchTab('plan'); lockPlan(curBatch); }
  if (act==='goops')    switchTab('ops');
  if (act==='autorun')  { switchTab('ops'); startAuto(curBatch); }
  if (act==='autostop') { stopAuto(); renderWs(); }
  if (act==='print')    { switchTab('report'); doPrint(); }
});

function renderTabs(b){
  $('stages').innerHTML = TABS.map((t,i)=>{
    const st = tabState(b,t.k);
    const on = curTab===t.k ? 'on' : '';
    const cls = st==='lock' ? 'lock' : (st==='done' ? 'done' : '');
    const ix = st==='done'
      ? `<span class="ix">✓</span>`
      : `<span class="ix">${i+1}</span>`;
    const tip = st==='lock' ? ` data-tip="${LOCK_TIP[t.k]}"` : '';
    const arrow = i<TABS.length-1 ? `<span class="stage-arrow">›</span>` : '';
    return `<button class="stage-tab ${on} ${cls}" data-tab="${t.k}"${tip}>${ix}${t.label}</button>${arrow}`;
  }).join('');
}
$('stages').addEventListener('click', e=>{
  const t = e.target.closest('.stage-tab'); if(!t||!curBatch) return;
  if (t.classList.contains('lock')) return;
  switchTab(t.dataset.tab);
});
function switchTab(k){
  if (!curBatch || tabState(curBatch,k)==='lock') return;
  curTab = k;
  renderTabs(curBatch);
  renderPanel(curBatch);
}

/* ---------- Panel render ---------- */
function renderPanel(b){
  const host = $('panel');
  if (curTab==='data')   host.innerHTML = panelData(b);
  if (curTab==='plan')   host.innerHTML = panelPlan(b);
  if (curTab==='ops')    host.innerHTML = panelOps(b);
  if (curTab==='report') host.innerHTML = panelReport(b);
}

/* ============ TAB 1: DỮ LIỆU ============ */
function srcIcon(){
  return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none">
    <ellipse cx="8" cy="3.6" rx="5.4" ry="2.1" stroke="currentColor" stroke-width="1.3"/>
    <path d="M2.6 3.6v8.8c0 1.16 2.42 2.1 5.4 2.1s5.4-.94 5.4-2.1V3.6" stroke="currentColor" stroke-width="1.3"/>
    <path d="M2.6 8c0 1.16 2.42 2.1 5.4 2.1s5.4-.94 5.4-2.1" stroke="currentColor" stroke-width="1.3"/>
  </svg>`;
}
function panelData(b){
  const ok = b.dataReceived;
  const stateLine = src => ok
    ? `<div class="src-state ok">✓ Đã nhận lúc ${b.receivedAt} — ${src}</div>`
    : `<div class="src-state"><span style="width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block"></span>Chưa nhận</div>`;
  return `<div class="panel">
    <div class="src-grid">
      <div class="src-card ${ok?'ok':''}">
        <div class="src-ic">${srcIcon()}</div>
        <div>
          <div class="src-name">ERP — Đơn phân bổ cửa hàng</div>
          <div class="src-ep">GET /api/v1/allocations?batch=${b.id.slice(-3)}</div>
          ${stateLine('8 SKU · 5 cửa hàng')}
        </div>
      </div>
      <div class="src-card ${ok?'ok':''}">
        <div class="src-ic">${srcIcon()}</div>
        <div>
          <div class="src-name">WMS — Tồn kho thực tế</div>
          <div class="src-ep">GET /api/v1/inventory?location=HCM-01</div>
          ${stateLine('242 dòng tồn')}
        </div>
      </div>
    </div>
    ${ ok
      ? `<div class="plan-note" style="padding-left:2px">
           <span class="dot" style="background:var(--green)"></span>
           Dữ liệu đã đồng bộ. Chuyển sang bước <b style="color:var(--text);margin:0 4px">Kế hoạch</b> để đối soát tồn.
         </div>`
      : `<button class="btn btn-primary" id="recvBtn">Nhận dữ liệu</button>` }
  </div>`;
}
function receiveData(b){
  if (b.dataReceived) return;
  const btn = $('recvBtn');
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Đang đồng bộ…`; }
  setTimeout(()=>{
    b.dataReceived = true;
    b.receivedAt = now();
    toast('Đã nhận dữ liệu từ ERP & WMS — mở khóa Kế hoạch');
    renderWs();
  }, 1400);
}

/* ============ TAB 2: KẾ HOẠCH ============ */
function skuStatus(s){
  if (s.stock < s.plan) return ['short','Thiếu '+(s.plan-s.stock)];
  if (s.stock > s.plan) return ['over','Dư '+(s.stock-s.plan)];
  return ['ok','Đủ'];
}
function panelPlan(b){
  const rows = SKUS.map(s=>{
    const [cls,label] = skuStatus(s);
    return `<tr>
      <td><div>${s.name}</div><div class="sku-code">${s.code}</div></td>
      <td class="num">${s.stock}</td>
      <td class="num">${s.plan}</td>
      <td><span class="pill ${cls}"><span class="dot"></span>${label}</span></td>
    </tr>`;
  }).join('');
  const shortCount = SKUS.filter(s=>s.stock<s.plan).length;
  const foot = b.planLocked
    ? `<span class="plan-note"><span class="dot" style="background:var(--green)"></span>
         Kế hoạch đã chốt — phân bổ theo tồn thực tế (${TOTAL_ACTUAL}/${TOTAL_PLAN} đơn vị).</span>`
    : `<span class="plan-note"><span class="dot"></span>
         ${shortCount} SKU thiếu tồn — hệ thống sẽ phân bổ lại theo tồn thực tế khi chốt.</span>
       <span style="flex:1"></span>
       <button class="btn btn-primary" id="lockBtn">Chốt kế hoạch</button>`;
  return `<div class="panel"><div class="card">
    <div class="card-h"><span class="t">Đối soát tồn / kế hoạch</span>
      <span class="s">${SKUS.length} SKU · kế hoạch ${TOTAL_PLAN} đơn vị</span></div>
    <table>
      <thead><tr><th>SKU</th><th class="num">Tồn thực tế</th><th class="num">Kế hoạch</th><th>Trạng thái</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="plan-foot">${foot}</div>
  </div></div>`;
}
function lockPlan(b){
  if (b.planLocked || !b.dataReceived) return;
  b.planLocked = true;
  feed(b,'accent','Kế hoạch đã chốt — '+TOTAL_ACTUAL+' đơn vị, sẵn sàng vận hành');
  toast('Đã chốt kế hoạch — mở khóa Vận hành');
  curTab = 'ops';
  renderWs();
}
$('panel').addEventListener('click', e=>{
  if (!curBatch) return;
  if (e.target.closest('#recvBtn'))  receiveData(curBatch);
  if (e.target.closest('#lockBtn'))  lockPlan(curBatch);
  if (e.target.closest('#scanBtn'))  manualScan(curBatch);
  if (e.target.closest('#autoBtn'))  { curBatch.ops.auto ? (stopAuto(),renderWs()) : startAuto(curBatch); }
  if (e.target.closest('#fixBtn'))   resolveIssue(curBatch);
  if (e.target.closest('#printBtn')) doPrint();
  const cell = e.target.closest('.cell.lit');
  if (cell) confirmBin(curBatch, cell.dataset.store);
});

/* ============ TAB 3: VẬN HÀNH ============ */
function renderZone(b, zKey){
  const z = ZONES[zKey], o = b.ops;
  const live = o.activeZone===zKey && o.phase!=='idle';
  let racks = '';
  for (let r=0; r<2; r++){
    let grid = '';
    for (let lv=3; lv>=1; lv--){
      for (let sl=0; sl<6; sl++){
        let cls='cell', inner='', store=null;
        for (const st of z.stores){
          const p = BIN_POS[st];
          if (p.rack===r && p.level===lv && p.slot===sl){ store=st; break; }
        }
        if (store){
          cls+=' bin'; inner=store;
          if (o.pendingBins[store]!=null){
            cls+=' lit';
            inner = store+`<span class="q">${o.pendingBins[store]}</span>`;
          } else if (o.doneBins[store]){
            cls+=' ok-bin'; inner='✓';
          }
        }
        grid += `<div class="${cls}" ${store?`data-store="${store}"`:''} ${o.pendingBins[store]!=null?`data-tip="CH ${store} — bỏ ${o.pendingBins[store]} đv, click xác nhận"`:''}>${inner}</div>`;
      }
    }
    racks += `<div class="rack"><div class="rack-lbl">KỆ ${zKey}${r+1} · 3 TẦNG × 6 NGĂN</div><div class="rgrid">${grid}</div></div>`;
  }
  return `<div class="zone ${live?'live':''}">
    <div class="zone-h">
      <span class="zone-name">${z.label}</span>
      <span class="worker-chip">${z.worker.name} <span class="wid">${z.worker.id}</span></span>
    </div>${racks}
  </div>`;
}
function scanBarHTML(b){
  const o = b.ops, done = opsComplete(b);
  if (done) return `<div class="scan-bar"><span class="scan-state okc" style="color:var(--green)">✓ Lô đã hoàn tất — xem tab Biên bản</span></div>`;
  const z = o.zonesLeft[0];
  const w = ZONES[z].worker;
  let state, btnLabel, btnDis = false;
  if (o.phase==='idle'){
    state = `Chu trình tiếp: <b style="color:var(--text)">${SKUS[o.skuIdx].name}</b> — ${ZONES[z].label}`;
    btnLabel = 'Quét thẻ NV';
  } else if (o.phase==='badge'){
    state = `<span class="okc">✓</span> Thẻ <span class="mono">${w.id}</span> ${w.name} — chờ quét thùng SKU`;
    btnLabel = 'Quét SKU';
  } else {
    const left = Object.keys(o.pendingBins).length;
    state = `<span style="color:var(--amber)">●</span> ${SKUS[o.skuIdx].name} — còn <b style="color:var(--text)">${left} bin</b> sáng đèn, click ô amber để xác nhận`;
    btnLabel = 'Đang chờ xác nhận bin…'; btnDis = true;
  }
  const autoBtn = o.auto
    ? `<button class="btn btn-ghost btn-sm" id="autoBtn">❚❚&ensp;Dừng demo</button>`
    : `<button class="btn btn-ghost btn-sm" id="autoBtn">▸&ensp;Tự chạy demo</button>`;
  return `<div class="scan-bar">
    <span class="scan-state">${state}</span>
    <button class="btn btn-primary btn-sm" id="scanBtn" ${btnDis||o.auto?'disabled':''}>${btnLabel}</button>
    ${autoBtn}
  </div>`;
}
function panelOps(b){
  const o = b.ops;
  const skuDone = o.perSkuDone.filter(Boolean).length;
  const banner = b.issue ? `
    <div class="issue-banner">
      <span class="x">✗</span><span class="grow">${b.issue}</span>
      <button class="btn btn-ghost btn-sm" id="fixBtn">Đánh dấu đã xử lý</button>
    </div>` : '';
  const curLine = (!opsComplete(b))
    ? `<div class="cur-task">Đang chia: <b>${SKUS[Math.min(o.skuIdx,7)].name}</b>
        ${o.activeZone?` — ${ZONES[o.activeZone].label} · ${ZONES[o.activeZone].worker.name}`:` — chờ quét`}</div>`
    : `<div class="cur-task" style="border-color:rgba(63,185,80,.35);color:#8fd49a">✓ Toàn bộ 8 SKU đã chia xong</div>`;
  const storeRows = STORES.map(st=>{
    const tot = SKUS.reduce((a,s)=>a+s.alloc[st],0);
    const v = o.perStore[st];
    return `<div class="store-row">
      <span class="sq">${st}</span><span style="width:62px">Cửa hàng ${st}</span>
      <span class="bar"><i style="width:${Math.round(v/tot*100)}%"></i></span>
      <span class="v">${v}/${tot} đv</span>
    </div>`;
  }).join('');
  const feedItems = o.feed.length
    ? o.feed.map(f=>`<div class="fitem f-${f.cls}"><span class="ft">${f.t}</span><span class="fd"></span><span>${f.txt}</span></div>`).join('')
    : `<div class="feed-empty">Chưa có sự kiện — quét thẻ NV để bắt đầu.</div>`;
  return `<div class="panel">
    ${banner}
    <div class="ops-grid">
      <div>
        <div class="zones">${renderZone(b,'A')}${renderZone(b,'B')}</div>
        ${scanBarHTML(b)}
      </div>
      <div style="display:grid;gap:14px">
        <div class="card"><div class="card-b" style="padding:16px 18px">
          <div class="prog-row">
            <div><div class="prog-lbl">SKU</div><div class="prog-num">${skuDone}<small>/8</small></div></div>
            <div><div class="prog-lbl">Đơn vị</div><div class="prog-num">${o.unitsDone}<small>/${TOTAL_ACTUAL}</small></div></div>
            <div><div class="prog-lbl">Tiến độ</div><div class="prog-num">${pct(b)}<small>%</small></div></div>
          </div>
          <div class="pbar"><i style="width:${pct(b)}%"></i></div>
          ${curLine}
          <div class="store-rows">${storeRows}</div>
        </div></div>
        <div class="card">
          <div class="card-h"><span class="t">Feed sự kiện</span><span class="s">thời gian thực</span></div>
          <div class="card-b" style="padding:8px 14px"><div class="feed">${feedItems}</div></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* --- máy trạng thái vận hành --- */
function manualScan(b){
  const o = b.ops;
  if (b.issue || opsComplete(b)) return;
  if (o.phase==='idle') scanBadge(b);
  else if (o.phase==='badge') scanSku(b);
}
function scanBadge(b){
  const o = b.ops;
  if (opsComplete(b) || b.issue) return;
  o.activeZone = o.zonesLeft[0];
  o.phase = 'badge';
  if (o.skuIdx===0 && o.unitsDone===0 && !o.feed.some(f=>f.cls==='accent'))
    feed(b,'accent','Bắt đầu vận hành lô — 2 nhân viên vào ca');
  const w = ZONES[o.activeZone].worker;
  feed(b,'accent',`Quét thẻ ✓ ${w.name} (${w.id}) — ${ZONES[o.activeZone].label}`);
  refreshOpsUI(b);
}
function scanSku(b){
  const o = b.ops, sku = SKUS[o.skuIdx], z = o.activeZone;
  o.phase = 'putting';
  o.pendingBins = {};
  ZONES[z].stores.forEach(st=>{ if (sku.alloc[st]>0) o.pendingBins[st]=sku.alloc[st]; });
  feed(b,'amber',`Quét SKU ${sku.name} — sáng ${Object.keys(o.pendingBins).length} bin ${ZONES[z].label}`);
  refreshOpsUI(b);
}
function confirmBin(b, store){
  const o = b.ops;
  if (o.phase!=='putting' || o.pendingBins[store]==null) return;
  const sku = SKUS[o.skuIdx], qty = o.pendingBins[store];
  delete o.pendingBins[store];
  o.doneBins[store] = true;
  o.unitsDone += qty;
  o.perStore[store] += qty;
  feed(b,'green',`● CH ${store} +${qty} đv ${sku.name} — xác nhận`);
  if (Object.keys(o.pendingBins).length===0){
    o.zonesLeft = o.zonesLeft.filter(z=>z!==o.activeZone);
    feed(b,'green',`${ZONES[o.activeZone].label} xong ${sku.name}`);
    o.activeZone = null; o.phase = 'idle';
    if (o.zonesLeft.length===0){
      o.perSkuDone[o.skuIdx] = true;
      o.doneBins = {};
      feed(b,'green',`✓ Hoàn tất SKU ${sku.name} (${o.perSkuDone.filter(Boolean).length}/8)`);
      o.skuIdx = Math.min(o.skuIdx+1, 7);
      o.zonesLeft = ['A','B'];
      if (opsComplete(b)){
        stopAuto();
        feed(b,'green',`✓ Lô hoàn tất — ${o.unitsDone}/${TOTAL_PLAN} đơn vị, thiếu ${TOTAL_PLAN-o.unitsDone}`);
        toast('Lô hoàn tất — đã mở khóa Biên bản');
      }
    }
  }
  refreshOpsUI(b, true);
}
function resolveIssue(b){
  if (!b.issue) return;
  b.issue = null;
  feed(b,'accent','Giám sát xác nhận xử lý sự cố — tiếp tục vận hành');
  toast('Đã xử lý sự cố — lô tiếp tục chạy');
  renderWs();
}
function refreshOpsUI(b, full){
  if (curBatch!==b) return;
  $('wsBadge').innerHTML = badgeHTML(b);
  renderAction(b);
  renderTabs(b);
  if (curTab==='ops') renderPanel(b);
  else if (full && opsComplete(b)) renderPanel(b);
}

/* --- auto demo --- */
function startAuto(b){
  if (b.issue){ toast('Xử lý sự cố trước khi chạy demo'); renderWs(); return; }
  if (opsComplete(b)) return;
  b.ops.auto = true;
  refreshOpsUI(b);
  autoStep(b);
}
function stopAuto(){
  BATCHES.forEach(b=>{
    if (b.ops.timer){ clearTimeout(b.ops.timer); b.ops.timer=null; }
    b.ops.auto = false;
  });
}
function autoStep(b){
  const o = b.ops;
  if (!o.auto || curBatch!==b) return;
  if (opsComplete(b)){ o.auto=false; refreshOpsUI(b); return; }
  let delay = 650;
  if (o.phase==='idle')       { scanBadge(b); delay = 620; }
  else if (o.phase==='badge') { scanSku(b);   delay = 560; }
  else { /* putting: xác nhận lần lượt từng bin */
    const next = Object.keys(o.pendingBins)[0];
    if (next){ confirmBin(b,next); delay = 460; }
  }
  if (o.auto && !opsComplete(b)) o.timer = setTimeout(()=>autoStep(b), delay);
  else refreshOpsUI(b);
}

/* ============ TAB 4: BIÊN BẢN ============ */
function panelReport(b){
  const o = b.ops;
  const missing = SKUS.filter(s=>s.plan>allocSum(s));
  const missTotal = missing.reduce((a,s)=>a+(s.plan-allocSum(s)),0);
  const rows = missing.map(s=>`<tr>
      <td><div>${s.name}</div><div class="sku-code">${s.code}</div></td>
      <td class="num">${s.plan}</td>
      <td class="num">${allocSum(s)}</td>
      <td class="num" style="color:var(--red)">−${s.plan-allocSum(s)}</td>
      <td><span class="pill short"><span class="dot"></span>Chờ nhập bổ sung</span></td>
    </tr>`).join('');
  return `<div class="panel">
    <div class="stat-grid">
      <div class="stat"><div class="k">SKU đã chia</div><div class="v green">8<small>/8</small></div></div>
      <div class="stat"><div class="k">Đơn vị thực chia</div><div class="v">${o.unitsDone}<small>/${TOTAL_PLAN} kế hoạch</small></div></div>
      <div class="stat"><div class="k">Thiếu hàng</div><div class="v red">${missTotal}<small> đv · ${missing.length} SKU</small></div></div>
      <div class="stat"><div class="k">Nhân sự / thời lượng</div><div class="v">2<small> NV · 42 phút</small></div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-h"><span class="t">Danh sách thiếu</span>
        <span class="s">đối soát ERP sau ca</span></div>
      <table>
        <thead><tr><th>SKU</th><th class="num">Kế hoạch</th><th class="num">Thực chia</th><th class="num">Chênh lệch</th><th>Xử lý</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-primary" id="printBtn">In phiếu</button>
      <span style="color:var(--text-3);font-size:12px">Biên bản ký bởi: Trần Thị B (NV-2207) · Lê Văn C (NV-3104) · Trưởng ca NQ</span>
    </div>
  </div>`;
}
function doPrint(){
  toast('Đang gửi lệnh in biên bản lô…');
  setTimeout(()=>{ try{ window.print(); }catch(e){} }, 350);
}

/* ============ Bàn phím ============ */
document.addEventListener('keydown', e=>{
  if (view==='inbox'){
    const list = visibleBatches();
    if (e.key==='ArrowDown'){ e.preventDefault(); selIdx=Math.min(selIdx+1,list.length-1); renderInbox(); }
    if (e.key==='ArrowUp')  { e.preventDefault(); selIdx=Math.max(selIdx-1,0); renderInbox(); }
    if (e.key==='Enter' && list[selIdx]) openBatch(list[selIdx].id);
  } else {
    if (e.key==='Escape') backToInbox();
  }
});

/* ============ Boot ============ */
renderInbox();
</script>
</body>
</html>
