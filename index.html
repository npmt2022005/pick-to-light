<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Put·to·Light — Warehouse Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222535;
  --border: rgba(255,255,255,.1);
  --text: #e8eaf6;
  --text-muted: #9295a8;
  --text-subtle: #5a5d70;
  --accent: #2f6fed;
  --green: #41bf58;
  --red: #f0564a;
  --yellow: #FFB01F;
  --purple: #a855f7;
  --radius: 10px;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
}

/* ─── LAYOUT ─── */
#app {
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: 200px 1fr;
  grid-template-areas:
    "header header"
    "sidenav main";
  height: 100vh;
}

/* ─── HEADER ─── */
#header {
  grid-area: header;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 24px;
  z-index: 100;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo span { color: var(--text-muted); font-weight: 300; }

.role-tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.role-tab {
  padding: 5px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.role-tab:hover { background: var(--surface2); color: var(--text); }
.role-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

/* ─── SIDENAV ─── */
#sidenav {
  grid-area: sidenav;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 10px 16px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 12px;
  border-left: 3px solid transparent;
  transition: all .16s;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active {
  background: rgba(47,111,237,.12);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.nav-item .step-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface2);
  color: var(--text-subtle);
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .16s;
}
.nav-item.active .step-num {
  background: var(--accent);
  color: #fff;
}
.nav-item.done .step-num {
  background: var(--green);
  color: #fff;
}

/* ─── MAIN ─── */
#main {
  grid-area: main;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ─── PAGE HEADER ─── */
.page-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.page-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.page-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

/* ─── CARDS ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-muted);
  margin-bottom: 16px;
}

/* ─── TABLES ─── */
.tbl-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: var(--surface2);
  color: var(--text-muted);
  font-weight: 600;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  letter-spacing: .04em;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  color: var(--text);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }

.stt { color: var(--text-subtle); }
.mono { font-family: var(--mono); }
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.badge-blue { background: rgba(47,111,237,.2); color: #6fa3f7; }
.badge-green { background: rgba(65,191,88,.2); color: var(--green); }
.badge-red { background: rgba(240,86,74,.2); color: var(--red); }
.badge-yellow { background: rgba(255,176,31,.2); color: var(--yellow); }
.badge-gray { background: rgba(255,255,255,.08); color: var(--text-muted); }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 7px;
  border: none;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #3a7af5; transform: translateY(-1px); }
.btn-primary:disabled { opacity: .4; cursor: default; transform: none; }
.btn-success {
  background: var(--green);
  color: #fff;
}
.btn-success:hover { background: #50d469; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.btn-outline:hover { background: var(--surface2); color: var(--text); }

/* ─── FORM INPUT ─── */
input[type="number"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 4px 8px;
  width: 70px;
  text-align: center;
}
input[type="number"]:focus {
  outline: none;
  border-color: var(--accent);
}

/* ─── STAT CARDS ─── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-label { font-size: 11px; color: var(--text-muted); }
.stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--text-subtle); }

/* ─── VẬN HÀNH layout ─── */
#ops-outer {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 12px;
  height: 100%;
}

/* ─── OPS SIDEBAR ─── */
#ops-sidebar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

.ops-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* STEP INDICATOR */
.step-track { display: flex; flex-direction: column; }
.step-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  position: relative;
}
.step-row:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 7px;
  top: 18px;
  width: 1px;
  height: calc(100% - 10px);
  background: var(--border);
}
.step-dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 2px;
  transition: all .3s;
  background: var(--surface2);
}
.step-row.s-active .step-dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 8px rgba(47,111,237,.6);
}
.step-row.s-done .step-dot {
  border-color: var(--green);
  background: var(--green);
}
.step-text {
  font-size: 10px;
  color: var(--text-subtle);
  padding: 2px 0 10px;
  line-height: 1.4;
}
.step-row.s-active .step-text { color: var(--text); font-weight: 600; }
.step-row.s-done .step-text { color: var(--text-muted); }

/* WORKER CARDS */
.worker-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: border-color .3s, box-shadow .3s;
  background: var(--surface2);
}
.worker-top {
  display: flex;
  align-items: center;
  gap: 6px;
}
.worker-color-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.worker-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.worker-code { font-size: 10px; color: var(--text-subtle); }
.worker-status { font-size: 10px; color: var(--text-muted); line-height: 1.4; }
.worker-sku { font-size: 10px; font-weight: 600; }
.worker-progress-bar {
  height: 3px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}
.worker-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .4s ease;
}

/* ─── PHÂN CÔNG KHU VỰC ─── */
.zone-assign-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.zone-assign-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color .2s;
}
.zone-assign-card.selecting {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(47,111,237,.15);
}
.zone-assign-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.zone-color-bar {
  width: 4px;
  height: 36px;
  border-radius: 3px;
  flex-shrink: 0;
}
.zone-assign-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.zone-assign-sub {
  font-size: 11px;
  color: var(--text-muted);
}
.worker-slots {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.worker-slot-filled {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.worker-slot-filled .wdot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.worker-slot-filled .wname {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.worker-slot-filled .wcode {
  font-size: 10px;
  color: var(--text-subtle);
}
.worker-slot-filled .wremove {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(240,86,74,.15);
  border: none;
  color: var(--red);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.worker-slot-filled .wremove:hover { background: rgba(240,86,74,.35); }
.worker-slot-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border: 1px dashed rgba(255,255,255,.15);
  border-radius: 7px;
  font-size: 11px;
  color: var(--text-subtle);
  cursor: pointer;
  transition: all .15s;
  gap: 6px;
}
.worker-slot-empty:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(47,111,237,.06);
}
.pool-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.pool-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.pool-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pool-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
  font-size: 11px;
}
.pool-chip:hover {
  border-color: var(--accent);
  background: rgba(47,111,237,.08);
}
.pool-chip.selecting-target {
  border-color: var(--accent);
  background: rgba(47,111,237,.12);
  animation: pulse-border 1s ease-in-out infinite;
}
@keyframes pulse-border {
  0%,100% { box-shadow: 0 0 0 0 rgba(47,111,237,.4); }
  50% { box-shadow: 0 0 0 4px rgba(47,111,237,.0); }
}
.pool-chip .cdot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pool-chip .cname { font-weight: 600; color: var(--text); }
.pool-chip .ccode { color: var(--text-subtle); }
.pool-chip-empty {
  font-size: 11px;
  color: var(--text-subtle);
  font-style: italic;
}

/* ─── SIM STATUS ─── */
.sim-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(65,191,88,.1);
  border: 1px solid rgba(65,191,88,.25);
  border-radius: 7px;
  font-size: 11px;
  color: var(--green);
}
.sim-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 1s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: .2; }
}

/* ─── LED BOARD ─── */
#led-board {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.zone-section { display: flex; flex-direction: column; gap: 8px; }
.zone-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.zone-dot { width: 7px; height: 7px; border-radius: 50%; }
.zone-bins {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* ─── BIN CARD ─── */
.bin-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: border-color .25s, box-shadow .25s;
  position: relative;
}
.bin-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 4px;
}
.bin-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}
.bin-subname {
  font-size: 9px;
  color: var(--text-subtle);
  margin-top: 1px;
}
.bin-addr {
  font-size: 9px;
  color: var(--text-subtle);
  font-family: var(--mono);
  background: rgba(255,255,255,.06);
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}
.bin-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 8px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: .06em;
  animation: pulse-badge .7s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes pulse-badge {
  from { opacity: .75; transform: scale(1); }
  to   { opacity: 1;   transform: scale(1.04); }
}

/* ─── LED SLOTS ─── */
.led-slots { display: flex; flex-direction: column; gap: 4px; }
.led-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 7px;
  border-radius: 5px;
  border: 1px solid rgba(255,255,255,.04);
  background: rgba(255,255,255,.02);
  transition: background .25s, border-color .25s, opacity .25s;
  min-height: 24px;
}
.led-row.lit {
  background: var(--led-bg, rgba(255,255,255,.05));
  border-color: var(--led-border, rgba(255,255,255,.12));
}
.led-row.led-active {
  background: var(--led-active-bg, rgba(255,255,255,.1));
  border-color: var(--led-color, rgba(255,255,255,.3));
}
.led-row.confirmed { opacity: .38; }
.led-row.unlit { opacity: .2; }
.led-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: box-shadow .3s;
}
.led-row.lit .led-dot,
.led-row.led-active .led-dot {
  animation: led-pulse 1.1s ease-in-out infinite alternate;
}
.led-row.confirmed .led-dot,
.led-row.unlit .led-dot { animation: none; }
@keyframes led-pulse {
  from { box-shadow: 0 0 5px var(--led-color), 0 0 10px var(--led-glow); }
  to   { box-shadow: 0 0 9px var(--led-color), 0 0 20px var(--led-glow); }
}
.led-sku {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-muted);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.led-row.lit .led-sku,
.led-row.led-active .led-sku { color: var(--text); }
.led-qty { font-size: 10px; font-weight: 700; color: var(--text); }
.led-unit { font-size: 9px; color: var(--text-subtle); }
.led-check { font-size: 10px; color: var(--green); display: none; }
.led-row.confirmed .led-check { display: block; }
.led-row.confirmed .led-qty { text-decoration: line-through; color: var(--text-subtle); }
.led-row.confirmed .led-sku { text-decoration: line-through; }

/* ─── BÁOCÁO ACCORDION ─── */
.accordion-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 6px;
}
.accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--surface2);
  cursor: pointer;
  gap: 10px;
  transition: background .15s;
}
.accordion-header:hover { background: rgba(255,255,255,.05); }
.accordion-title { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; }
.accordion-arrow { font-size: 10px; color: var(--text-subtle); transition: transform .2s; }
.accordion-item.open .accordion-arrow { transform: rotate(180deg); }
.accordion-body { display: none; padding: 12px; background: var(--surface); }
.accordion-item.open .accordion-body { display: block; }

/* ─── IT SCREEN ─── */
.warehouse-map { display: flex; flex-direction: column; gap: 14px; }
.zone-row {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  background: var(--surface2);
}
.zone-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.zone-bins-it { display: flex; gap: 10px; flex-wrap: wrap; }
.bin-it {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 130px;
}
.bin-it-code { font-size: 14px; font-weight: 700; color: var(--text); }
.bin-it-addr { font-size: 10px; color: var(--text-subtle); }
.bin-it-store { font-size: 11px; color: var(--text-muted); }

/* ─── COMING SOON ─── */
.coming-soon {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 320px;
  gap: 12px;
  color: var(--text-subtle);
}
.coming-soon-icon { font-size: 48px; opacity: .3; }
.coming-soon h3 { font-size: 16px; color: var(--text-muted); font-weight: 600; }
.coming-soon p { font-size: 12px; text-align: center; max-width: 260px; line-height: 1.7; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }

/* SCANNER */
.scan-mode-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0 8px; border-bottom: 1px solid var(--border);
}
.scan-mode-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-subtle);
}
.scan-mode-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; padding: 4px 10px; font-size: 10px; font-weight: 600;
  font-family: var(--mono); cursor: pointer;
}
.scan-mode-btn.on { border-color: var(--accent); color: var(--accent); background: rgba(47,111,237,.12); }
.scan-wait-hint {
  width: 100%; text-align: center; padding: 10px; font-size: 11px;
  color: var(--text-muted); font-family: var(--mono);
  border: 1px dashed var(--border); border-radius: 8px;
  animation: scanPulse 1.6s ease infinite;
}
@keyframes scanPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.scan-toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 1000; padding: 10px 20px; border-radius: 8px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(0,0,0,.45); animation: toastIn .18s ease;
}
.scan-toast.ok   { background: #12351b; color: #7be495; border: 1px solid var(--green); }
.scan-toast.warn { background: #3a2d0d; color: #ffd27a; border: 1px solid var(--yellow); }
.scan-toast.err  { background: #3b1512; color: #ff9d94; border: 1px solid var(--red); }
.scan-toast.hide { display: none; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="logo">Put·<span>to</span>·Light</div>
    <div class="role-tabs">
      <button class="role-tab" data-role="it" onclick="setRole('it')">IT</button>
      <button class="role-tab" data-role="qlyvh" onclick="setRole('qlyvh')">Quản lý VH</button>
      <button class="role-tab" data-role="tql" onclick="setRole('tql')">Tổng Quản Lý</button>
    </div>
  </header>
  <nav id="sidenav"></nav>
  <main id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const WORKERS = [
  { name: 'Nguyễn Văn An',  code: 'NV-2207', color: '#FFB01F', colorName: 'Vàng',  slot: 0 },
  { name: 'Trần Thị Bình',  code: 'NV-3104', color: '#f0564a', colorName: 'Đỏ',    slot: 1 },
  { name: 'Lê Văn Cường',   code: 'NV-4102', color: '#41bf58', colorName: 'Xanh',  slot: 2 },
];

// 3 màu LED cố định mỗi khu vực
const SLOT_COLORS = [
  { key: 'yellow', hex: '#FFB01F', label: 'Vàng' },
  { key: 'red',    hex: '#f0564a', label: 'Đỏ'   },
  { key: 'green',  hex: '#41bf58', label: 'Xanh'  },
];

// Pool đầy đủ 9 nhân viên (dùng cho bước Phân công khu vực)
const WORKERS_POOL = [
  { name: 'Nguyễn Văn An',    code: 'NV-2207', color: '#FFB01F' },
  { name: 'Trần Thị Bình',    code: 'NV-3104', color: '#f0564a' },
  { name: 'Lê Văn Cường',     code: 'NV-4102', color: '#41bf58' },
  { name: 'Phạm Văn Dũng',    code: 'NV-5063', color: '#3b82f6' },
  { name: 'Hoàng Thị Em',     code: 'NV-6120', color: '#a855f7' },
  { name: 'Đặng Văn Phúc',    code: 'NV-7031', color: '#ec4899' },
  { name: 'Vũ Thị Giang',     code: 'NV-8044', color: '#06b6d4' },
  { name: 'Ngô Văn Hùng',     code: 'NV-9012', color: '#f97316' },
  { name: 'Đinh Thị Kim',     code: 'NV-0298', color: '#84cc16' },
];

const ZONES = [
  { id: 'A', name: 'Khu vực A', color: '#3b82f6', floors: 1, racksPerFloor: 1, binsPerRack: 49 },
];

// STORES = cửa hàng trong phiên demo (1 cửa hàng, thuộc khu vực A)
const STORES = [
  { id: 'CH-A01', addr: 'A-01', zone: 'A' },
];

// STORES_ALL = toàn bộ ngăn vật lý trong kho (49 ngăn khu A)
const STORES_ALL = [
  ...Array.from({length: 49}, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    return { id: `CH-A${n}`, addr: `A-${n}`, zone: 'A' };
  }),
];

const SKUS = [
  { id: 'SKU01', code: 'ATN01-WHT-L',  name: 'Áo thun basic trắng L',     qty: 160 }, // đủ  =160
  { id: 'SKU02', code: 'ATN01-BLK-XL', name: 'Áo thun basic đen XL',       qty: 110 }, // thiếu -22
  { id: 'SKU03', code: 'ATN01-NVY-M',  name: 'Áo thun basic navy M',        qty: 95  }, // dư  +6
];

// PLAN[skuIndex][storeIndex] — 3 SKU × 1 store
const PLAN = [
  [160], // SKU01 total=160 → đủ (tồn 160)
  [132], // SKU02 total=132 → thiếu -22 (tồn 110)
  [ 89], // SKU03 total=89  → dư +6 (tồn 95)
];

// Không gán cứng SKU cho nhân viên nữa — nhân viên tự nhận thùng:
// quét thẻ (chọn người) rồi quét tem thùng (nhận SKU đó về mình).
// Chế độ mô phỏng tự bốc SKU còn trong pool cho người đang rảnh.

/* ═══════════════════════════════════════════════════════════ 
   APP STATE
═══════════════════════════════════════════════════════════ */
let state = {
  role: 'qlyvh',
  screen: 'tiepnhan',

  // Vận hành
  opsStep: 0,           // 0-5
  simRunning: false,
  simTimer: null,
  simDone: false,
  // false = mô phỏng tự chạy, true = chờ sự kiện từ máy quét thật (nhớ lựa chọn qua localStorage)
  scanMode: (() => { try { return localStorage.getItem('ptl-scanMode') === '1'; } catch (e) { return false; } })(),

  workerActive:       [false, false, false],
  workerCurrentSku:   [null, null, null],   // SKU idx đang chia (null = rảnh, chờ nhận thùng)
  workerRoundsDone:   [0, 0, 0],            // số thùng SKU mỗi người đã chia xong
  workerDone:         [false, false, false],
  skuStatus:          SKUS.map(() => 'pool'), // 'pool' = chưa ai nhận | 'active' = đang chia | 'done' = xong
  armedSlot:          null,                 // slot vừa quét thẻ, đang chờ quét thùng để nhận việc
  // confirmed[slot][globalStoreIdx] = true when that bin is done
  confirmed: [
    new Array(STORES.length).fill(false),
    new Array(STORES.length).fill(false),
    new Array(STORES.length).fill(false),
  ],
  // Per-slot, per-zone: local bin index within that zone (0,1,2...)
  workerZoneIdx: [
    { A: 0 },
    { A: 0 },
    { A: 0 },
  ],
  // Per-slot, per-zone: true when that zone finished all bins for current SKU round
  workerZoneDone: [
    { A: false },
    { A: false },
    { A: false },
  ],

  // Điều chỉnh: tổng sẽ phân mỗi SKU (manager edit tay)
  // mặc định = tổng kế hoạch gốc — để manager thấy rõ thiếu/dư và tự chỉnh
  editPlan: Array.from({length: SKUS.length}, (_, si) => [...PLAN[si]]),

  // IT: khu vực do IT thêm vào
  extraZones: [],
  showAddZone: false,
  testBins: {},      // addr → color đang test ('yellow'|'red'|'green')
  testZoneId: null,  // zone đang hiện panel test

  // Phân công khu vực: { zoneId: { yellow, red, green } } — mỗi slot = workerCode | null
  zoneAssignments: {
    A: { yellow: null, red: null, green: null },
  },
  selectingSlot: null, // { zoneId, colorKey } | null

  // Report data: distributed[skuIdx][storeIdx]
  distributed: Array.from({length: SKUS.length}, () => new Array(STORES.length).fill(0)),
};

/* ═══════════════════════════════════════════════════════════
   NAV CONFIG
═══════════════════════════════════════════════════════════ */
const NAV = {
  it: [
    { id: 'sodomkho', label: 'Sơ đồ kho' },
  ],
  qlyvh: [
    { id: 'tiepnhan',    label: 'Hàng tiếp nhận',     step: 1 },
    { id: 'kehoach',     label: 'Kế hoạch phân phối', step: 2 },
    { id: 'dieuchinhh', label: 'Điều chỉnh',          step: 3 },
    { id: 'phancong',   label: 'Phân công khu vực',   step: 4 },
    { id: 'vanhanh',    label: 'Vận hành',             step: 5 },
    { id: 'baocao',     label: 'Báo cáo',              step: 6 },
  ],
  tql: [],
};

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function hex2rgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Trả về mảng global store indices thuộc zone này (e.g. zone A → [0,1,2])
function getZoneStoreIndices(zoneId) {
  return STORES.map((s, i) => s.zone === zoneId ? i : -1).filter(i => i >= 0);
}

function getPlanTotal(skuIdx) {
  return PLAN[skuIdx].reduce((a, b) => a + b, 0);
}

function getEditTotal(si) {
  return state.editPlan[si].reduce((a, b) => a + b, 0);
}

function getWorkerCurrentSkuIdx(slot) {
  return state.workerCurrentSku[slot];
}

// Gán SKU cho nhân viên (quét thùng ở chế độ thật, hoặc tự động ở mô phỏng)
function claimSku(slot, skuIdx) {
  state.workerCurrentSku[slot] = skuIdx;
  state.skuStatus[skuIdx] = 'active';
  // Reset tiến độ vòng chia cho slot này
  [...ZONES, ...state.extraZones].forEach(z => {
    state.workerZoneIdx[slot][z.id] = 0;
    state.workerZoneDone[slot][z.id] = false;
  });
  state.confirmed[slot] = new Array(STORES.length).fill(false);
  settleIdleWorkers(); // thùng cuối vừa được nhận → người còn rảnh coi như xong ca
}

// "Giơ tay" có hẹn giờ: quét thẻ xong phải quét thùng trong ARM_TIMEOUT_MS,
// quá hạn tự nhả để không kẹt hàng đợi
const ARM_TIMEOUT_MS = 20000;
let armedTimer = null;

function armSlot(slot) {
  state.armedSlot = slot;
  clearTimeout(armedTimer);
  armedTimer = setTimeout(() => {
    if (state.armedSlot !== slot) return;
    state.armedSlot = null;
    const ws = getWorkersForSlot(SLOT_COLORS[slot].key);
    const name = ws.length ? ws[0].name : `đèn ${SLOT_COLORS[slot].label}`;
    scanFeedback('warn', `⌁ Quá ${ARM_TIMEOUT_MS / 1000}s không quét thùng — ${name} cần quét lại thẻ`);
    renderOpsSidebar();
  }, ARM_TIMEOUT_MS);
}

function disarmSlot() {
  clearTimeout(armedTimer);
  state.armedSlot = null;
}

// Pool hết SKU → nhân viên nào đang rảnh coi như xong ca
function settleIdleWorkers() {
  if (state.skuStatus.some(st => st === 'pool')) return;
  [0,1,2].forEach(s => {
    if (state.workerActive[s] && state.workerCurrentSku[s] === null) state.workerDone[s] = true;
  });
}

function getWorkerCurrentSku(slot) {
  const idx = getWorkerCurrentSkuIdx(slot);
  return idx !== null ? SKUS[idx] : null;
}

/* ═══════════════════════════════════════════════════════════
   ROLE + SCREEN SWITCHING
═══════════════════════════════════════════════════════════ */
function setRole(role) {
  if (state.simRunning) {
    clearInterval(state.simTimer);
    state.simRunning = false;
  }
  state.role = role;
  if (role === 'it')      state.screen = 'sodomkho';
  else if (role === 'qlyvh') state.screen = 'tiepnhan';
  else                    state.screen = 'tql';
  renderAll();
}

function setScreen(id) {
  state.screen = id;
  // Reset main padding for ops screen
  renderAll();
}

/* ═══════════════════════════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════════════════════════ */
function renderAll() {
  renderHeader();
  renderSidenav();
  renderMain();
}

function renderHeader() {
  document.querySelectorAll('.role-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.role === state.role);
  });
}

function renderSidenav() {
  const nav = document.getElementById('sidenav');
  const items = NAV[state.role] || [];

  if (items.length === 0) {
    nav.innerHTML = '';
    return;
  }

  let html = '<div class="nav-label">' +
    (state.role === 'it' ? 'Quản lý hệ thống' : 'Quy trình làm việc') +
    '</div>';

  const currentIdx = items.findIndex(i => i.id === state.screen);

  items.forEach((item, idx) => {
    const isActive = state.screen === item.id;
    const isDone = idx < currentIdx;
    let cls = 'nav-item';
    if (isActive) cls += ' active';
    if (isDone)   cls += ' done';
    const numHtml = item.step
      ? `<span class="step-num">${isDone ? '✓' : item.step}</span>`
      : '';
    html += `<div class="${cls}" onclick="setScreen('${item.id}')">${numHtml}<span>${item.label}</span></div>`;
  });

  nav.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   MAIN DISPATCHER
═══════════════════════════════════════════════════════════ */
function renderMain() {
  const main = document.getElementById('main');

  if (state.screen === 'vanhanh') {
    // Full-height ops screen — remove standard padding
    main.style.padding = '0';
    main.style.overflow = 'hidden';
    main.style.gap = '0';
    main.innerHTML = '';
    renderVanHanh(main);
    return;
  }

  // Standard screens
  main.style.padding = '24px';
  main.style.overflow = 'auto';
  main.style.gap = '20px';
  main.innerHTML = '';

  if (state.role === 'tql') { renderComingSoon(main); return; }

  switch (state.screen) {
    case 'sodomkho':   renderIT(main); break;
    case 'tiepnhan':   renderTiepNhan(main); break;
    case 'kehoach':    renderKeHoach(main); break;
    case 'dieuchinhh': renderDieuChinh(main); break;
    case 'phancong':   renderPhanCong(main); break;
    case 'baocao':     renderBaoCao(main); break;
  }
}

/* ═══════════════════════════════════════════════════════════
   COMING SOON
═══════════════════════════════════════════════════════════ */
function renderComingSoon(el) {
  el.innerHTML = `
    <div class="coming-soon">
      <div class="coming-soon-icon">🔒</div>
      <h3>Tổng Quản Lý</h3>
      <p>Màn hình đang được phát triển. Sẽ bao gồm báo cáo tổng hợp, quản lý nhiều phiên làm việc và phân tích hiệu suất toàn hệ thống.</p>
      <span class="badge badge-gray" style="margin-top:8px">Coming Soon</span>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
   SCREEN: IT — SƠ ĐỒ KHO
═══════════════════════════════════════════════════════════ */
function renderIT(el) {
  const allZones = [...ZONES, ...state.extraZones];
  const totalBins = STORES.length + state.extraZones.reduce((a, z) => a + z.binCount, 0);

  let html = `
    <div class="page-header">
      <div class="page-title">Sơ đồ kho</div>
      <div class="page-subtitle">Bố cục vật lý — ${allZones.length} khu vực · ${totalBins} bin</div>
    </div>
    <div class="card">
      <div class="card-title">Tổng quan hệ thống</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Khu vực</div><div class="stat-value">${allZones.length}</div><div class="stat-sub">${allZones.map(z=>z.id).join(' · ')}</div></div>
        <div class="stat-card"><div class="stat-label">Tổng Bin</div><div class="stat-value">${totalBins}</div><div class="stat-sub">LED module</div></div>
        <div class="stat-card"><div class="stat-label">Màu LED / Bin</div><div class="stat-value">3</div><div class="stat-sub">Vàng · Đỏ · Xanh</div></div>
        <div class="stat-card"><div class="stat-label">Nhân viên</div><div class="stat-value">3</div><div class="stat-sub">mỗi ca</div></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;font-weight:600;color:var(--text-muted)">Bố cục khu vực</div>
      <button class="btn" onclick="toggleAddZone()" style="font-size:12px;padding:6px 14px">
        ${state.showAddZone ? '✕ Đóng' : '+ Thêm khu vực'}
      </button>
    </div>`;

  if (state.showAddZone) {
    const ZONE_COLORS = ['#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#f97316'];
    const usedCount = allZones.length;
    const nextColor = ZONE_COLORS[usedCount % ZONE_COLORS.length];
    const nextId = String.fromCharCode(65 + usedCount);
    html += `
      <div class="card" style="border:1px solid var(--accent);background:rgba(99,102,241,.04)">
        <div class="card-title" style="color:var(--accent)">Thêm khu vực mới</div>
        <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
          <div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Mã khu vực</div>
            <input id="it-zone-id" type="text" value="${nextId}" maxlength="3"
              style="width:64px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;font-weight:700;text-align:center">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Tên khu vực</div>
            <input id="it-zone-name" type="text" placeholder="VD: Khu vực D"
              style="width:170px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px">
          </div>
          <div style="display:flex;gap:10px;align-items:flex-end">
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Số tầng</div>
              <input id="it-floors" type="number" value="1" min="1" max="10" oninput="updateZoneTotal()"
                style="width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;text-align:center">
            </div>
            <div style="padding-bottom:8px;color:var(--text-subtle);font-size:16px">×</div>
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Số kệ / tầng</div>
              <input id="it-racks" type="number" value="1" min="1" max="20" oninput="updateZoneTotal()"
                style="width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;text-align:center">
            </div>
            <div style="padding-bottom:8px;color:var(--text-subtle);font-size:16px">×</div>
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Số ngăn / kệ</div>
              <input id="it-bins" type="number" value="3" min="1" max="20" oninput="updateZoneTotal()"
                style="width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;text-align:center">
            </div>
            <div style="padding-bottom:6px">
              <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px">Tổng ngăn</div>
              <div id="it-total" style="font-size:18px;font-weight:700;color:var(--accent)">3</div>
            </div>
          </div>
          <button class="btn btn-success" onclick="addZone()" style="padding:7px 20px;font-size:13px">Thêm</button>
        </div>
      </div>`;
  }

  html += `<div class="warehouse-map">`;

  // Existing zones (from ZONES const)
  ZONES.forEach(zone => {
    const assignedStores = STORES_ALL.filter(s => s.zone === zone.id);
    const sessionStores  = STORES.filter(s => s.zone === zone.id);
    const hasLayout = zone.floors && zone.racksPerFloor && zone.binsPerRack;
    const totalBinsZone = hasLayout ? zone.floors * zone.racksPerFloor * zone.binsPerRack : assignedStores.length;

    html += `
      <div class="zone-row">
        <div class="zone-header">
          <div class="zone-dot" style="width:14px;height:14px;border-radius:50%;background:${zone.color};box-shadow:0 0 8px ${zone.color}88"></div>
          <span style="font-weight:700;font-size:14px;color:${zone.color}">${zone.name}</span>

      for (let k = 1; k <= zone.racksPerFloor; k++) {
        html += `<div style="display:flex;align-items:center;gap:10px;margin:4px 0 4px 16px">
          <span style="font-size:10px;color:var(--text-subtle);white-space:nowrap;min-width:36px">Kệ ${k}</span>

    html += `</div>`;
  });

  html += `</div>
    <div class="card">
      <div class="card-title">Slot màu LED — mỗi khu vực</div>

  SLOT_COLORS.forEach((sc, slot) => {
    const ws = getWorkersForSlot(sc.key);
    const workerInfo = ws.length > 0

      <td style="font-size:11px">${workerInfo}</td>

  });
  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

function toggleAddZone() {
  state.showAddZone = !state.showAddZone;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function updateZoneTotal() {
  const f = Math.max(1, parseInt(document.getElementById('it-floors').value) || 1);
  const k = Math.max(1, parseInt(document.getElementById('it-racks').value) || 1);
  const n = Math.max(1, parseInt(document.getElementById('it-bins').value) || 1);
  const el = document.getElementById('it-total');
  if (el) el.textContent = f * k * n;
}

function addZone() {
  const ZONE_COLORS = ['#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#f97316'];
  const id     = (document.getElementById('it-zone-id').value || '').trim().toUpperCase();
  const name   = (document.getElementById('it-zone-name').value || '').trim();
  const floors = Math.max(1, parseInt(document.getElementById('it-floors').value) || 1);
  const racks  = Math.max(1, parseInt(document.getElementById('it-racks').value) || 1);
  const bins   = Math.max(1, parseInt(document.getElementById('it-bins').value) || 1);
  const color  = ZONE_COLORS[([...ZONES, ...state.extraZones].length) % ZONE_COLORS.length];
  if (!id || !name) return;
  state.extraZones.push({ id, name, color, floors, racksPerFloor: racks, binsPerRack: bins });
  state.showAddZone = false;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function removeExtraZone(zi) {
  state.extraZones.splice(zi, 1);
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

const LED_TEST_COLORS = [
  { key: 'yellow', hex: '#FFB01F', label: 'Vàng' },
  { key: 'red',    hex: '#f0564a', label: 'Đỏ'   },
  { key: 'green',  hex: '#41bf58', label: 'Xanh'  },
];

function testBin(addr, colorKey) {
  if (!state.testBins[addr]) state.testBins[addr] = {};
  if (state.testBins[addr][colorKey]) delete state.testBins[addr][colorKey];
  else state.testBins[addr][colorKey] = true;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function filterSKU(query, tbodyId) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll(`#${tbodyId} tr`).forEach(row => {
    row.style.display = q && !row.textContent.toLowerCase().includes(q) ? 'none' : '';
  });
}

function clearBin(addr) {
  delete state.testBins[addr];
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function toggleTestZonePanel(zoneId) {
  state.testZoneId = state.testZoneId === zoneId ? null : zoneId;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function testZone(zoneId, colorKey) {
  const zone = [...ZONES, ...state.extraZones].find(z => z.id === zoneId);
  if (!zone) return;
  // Collect all bin addrs for this zone
  const addrs = [];
  if (zone.floors && zone.racksPerFloor && zone.binsPerRack) {
    for (let f = 1; f <= zone.floors; f++)
      for (let k = 1; k <= zone.racksPerFloor; k++)
        for (let n = 1; n <= zone.binsPerRack; n++)
          addrs.push(`${zone.id}-${String(n).padStart(2,'0')}`);
  } else {
    STORES.filter(s => s.zone === zoneId).forEach(s => addrs.push(s.addr));
  }
  addrs.forEach(addr => { state.testBins[addr] = { [colorKey]: true }; });
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}

function clearZone(zoneId) {
  const zone = [...ZONES, ...state.extraZones].find(z => z.id === zoneId);
  if (!zone) return;
  Object.keys(state.testBins).forEach(addr => {
    if (addr.startsWith(zoneId + '-')) delete state.testBins[addr];
  });
  state.testZoneId = null;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderIT(el); }
}
