function renderDieuChinh(el) {
  const hasDeficit  = SKUS.some((sku, si) => getEditTotal(si) > sku.qty);
  const deficitCount = SKUS.filter((sku, si) => getEditTotal(si) > sku.qty).length;
  const surplusCount = SKUS.filter((sku, si) => getEditTotal(si) < sku.qty).length;

  let html = `
    <div class="page-header">
      <div class="page-title">Điều chỉnh kế hoạch</div>
      <div class="page-subtitle">Đối chiếu hàng tiếp nhận với kế hoạch phân phối — chỉnh số lượng từng ngăn trước khi bắt đầu</div>
    </div>`;

  if (hasDeficit) {
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:rgba(240,86,74,.08);border:1px solid rgba(240,86,74,.35);margin-bottom:14px;font-size:12px">
      <span style="color:var(--red);font-size:16px">⚠</span>
      <div>
        <strong style="color:var(--red)">${deficitCount} SKU thiếu hàng</strong>
        <span style="color:var(--text-muted);margin-left:6px">— Giảm số lượng ngăn xuống (tổng ≤ SL tiếp nhận) để có thể chốt kế hoạch</span>
      </div>
    </div>`;
  }

  html += `<div class="card"><div class="tbl-wrap"><table>
    <thead>
      <tr>
        <th style="white-space:nowrap">Mã SKU</th>
        <th>Tên hàng</th>
        <th style="text-align:right;white-space:nowrap">Tiếp nhận</th>
        ${STORES.map(s => `<th style="text-align:center;font-size:10px">${s.id}<br><span style="font-size:9px;opacity:.6">${s.id}</span></th>`).join('')}
        <th style="text-align:right;white-space:nowrap">KH gốc</th>
        <th style="text-align:right;white-space:nowrap">Sẽ phân</th>
        <th style="text-align:right;white-space:nowrap">Dư/Thiếu</th>
        <th>Trạng thái</th>
      </tr>
    </thead>
    <tbody>`;

  SKUS.forEach((sku, si) => {
    const received    = sku.qty;
    const planOrig    = getPlanTotal(si);
    const willDistrib = getEditTotal(si);
    const surplus     = received - willDistrib;
    const isDeficit   = willDistrib > received;
    const isExact     = surplus === 0;
    const rowBg       = isDeficit ? 'background:rgba(240,86,74,.05)' : '';
    const badgeCls    = isDeficit ? 'badge-red' : isExact ? 'badge-green' : 'badge-yellow';
    const label       = isDeficit ? 'Thiếu hàng' : isExact ? 'Đủ hàng' : `Dư ${surplus} sp`;

    html += `<tr style="${rowBg}">
      <td><span class="mono" style="color:var(--accent);font-size:11px">${sku.code}</span></td>
      <td style="font-size:11px;white-space:nowrap">${sku.name}</td>
      <td style="text-align:right;font-weight:600">${received}</td>`;

    STORES.forEach((_, ci) => {
      const cellVal = state.editPlan[si][ci];
      const borderC = isDeficit ? 'var(--red)' : 'var(--border)';
      html += `<td style="padding:3px 4px;text-align:center">
        <input type="number" value="${cellVal}" min="0"
          onchange="updatePlanCell(${si},${ci},this.value)"
          style="width:44px;background:var(--surface2);border:1px solid ${borderC};border-radius:4px;padding:2px 4px;color:var(--text);font-size:11px;font-weight:600;text-align:center">
      </td>`;
    });

    html += `
      <td style="text-align:right;color:var(--text-muted);font-size:12px">${planOrig}</td>
      <td style="text-align:right;font-weight:700;color:${isDeficit?'var(--red)':'var(--text)'}">${willDistrib}</td>
      <td style="text-align:right;font-weight:600;color:${isDeficit?'var(--red)':isExact?'var(--text-muted)':'var(--yellow)'}">
        ${isDeficit ? `−${willDistrib - received}` : surplus > 0 ? `+${surplus}` : '—'}
      </td>
      <td><span class="badge ${badgeCls}">${label}</span></td>
    </tr>`;
  });

  // Footer totals row
  const totalReceived = SKUS.reduce((a, s) => a + s.qty, 0);
  const totalOrig     = PLAN.reduce((a, row) => a + row.reduce((x, y) => x + y, 0), 0);
  const totalWill     = SKUS.reduce((a, _, si) => a + getEditTotal(si), 0);
  const totalSurplus  = totalReceived - totalWill;

  html += `<tr style="border-top:2px solid var(--border);font-weight:700;background:var(--surface2)">
    <td colspan="2" style="color:var(--text-muted)">Tổng cộng</td>
    <td style="text-align:right">${totalReceived}</td>
    ${STORES.map((_, ci) => {
      const colTotal = SKUS.reduce((a, _, si) => a + state.editPlan[si][ci], 0);
      return `<td style="text-align:center;font-size:11px">${colTotal}</td>`;
    }).join('')}
    <td style="text-align:right;color:var(--text-muted)">${totalOrig}</td>
    <td style="text-align:right">${totalWill}</td>
    <td style="text-align:right;color:${totalSurplus < 0 ? 'var(--red)' : 'var(--yellow)'}">
      ${totalSurplus >= 0 ? '+' + totalSurplus : totalSurplus}
    </td>
    <td></td>
  </tr></tbody></table></div></div>

  <div style="display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:4px">
    ${hasDeficit
      ? `<span style="font-size:11px;color:var(--red)">⚠ Còn ${deficitCount} SKU thiếu hàng — giảm SL ngăn trước khi chốt</span>
         <button class="btn" style="background:var(--surface2);color:var(--text-muted);cursor:not-allowed;opacity:.5" disabled>✓ Chốt kế hoạch</button>`
      : `<span style="font-size:11px;color:var(--text-muted)">${surplusCount > 0 ? `${surplusCount} SKU dư kho — sẽ ghi nhận trong báo cáo` : 'Tất cả SKU khớp số lượng'}</span>
         <button class="btn btn-success" onclick="chotKeHoach()">✓ Chốt kế hoạch</button>`
    }
  </div>`;

  el.innerHTML = html;
}

function updatePlanCell(si, ci, val) {
  state.editPlan[si][ci] = Math.max(0, parseInt(val) || 0);
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderDieuChinh(el); }
}

function chotKeHoach() {
  const hasDeficit = SKUS.some((sku, si) => getEditTotal(si) > sku.qty);
  if (hasDeficit) return;
  setScreen('phancong');
}

/* ═══════════════════════════════════════════════════════════
   SCREEN 4: PHÂN CÔNG KHU VỰC
═══════════════════════════════════════════════════════════ */
function getAssignedCodes() {
  const codes = [];
  Object.values(state.zoneAssignments).forEach(zone => {
    Object.values(zone).forEach(code => { if (code) codes.push(code); });
  });
  return codes;
}

function getPoolWorkers() {
  const assigned = new Set(getAssignedCodes());
  return WORKERS_POOL.filter(w => !assigned.has(w.code));
}

// Lấy danh sách worker được gán cho 1 màu (yellow/red/green) qua tất cả zone
function getWorkersForSlot(colorKey) {
  const result = [];
  ZONES.forEach(z => {
    const code = state.zoneAssignments[z.id] && state.zoneAssignments[z.id][colorKey];
    if (code) {
      const w = WORKERS_POOL.find(x => x.code === code);
      if (w) result.push({ ...w, zoneId: z.id, zoneName: z.name });
    }
  });
  return result;
}

function startPickSlot(zoneId, colorKey) {
  const cur = state.selectingSlot;
  if (cur && cur.zoneId === zoneId && cur.colorKey === colorKey) {
    state.selectingSlot = null;
  } else {
    state.selectingSlot = { zoneId, colorKey };
  }
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderPhanCong(el); }
}

function assignWorkerToSlot(code) {
  if (!state.selectingSlot) return;
  const { zoneId, colorKey } = state.selectingSlot;
  if (!state.zoneAssignments[zoneId]) return;
  state.zoneAssignments[zoneId][colorKey] = code;
  state.selectingSlot = null;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderPhanCong(el); }
}

function removeWorkerFromSlot(zoneId, colorKey) {
  if (state.zoneAssignments[zoneId]) {
    state.zoneAssignments[zoneId][colorKey] = null;
  }
  state.selectingSlot = null;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderPhanCong(el); }
}

function cancelPickSlot() {
  state.selectingSlot = null;
  const el = document.getElementById('main');
  if (el) { el.innerHTML = ''; renderPhanCong(el); }
}

function renderPhanCong(el) {
  const pool = getPoolWorkers();
  const totalAssigned = getAssignedCodes().length;
  const canStart = totalAssigned > 0;
  const sel = state.selectingSlot; // { zoneId, colorKey } | null

  let html = `
    <div class="page-header">
      <div class="page-title">Phân công khu vực</div>
      <div class="page-subtitle">Gán nhân viên vào từng slot màu đèn — 3 màu cố định mỗi khu vực · ${totalAssigned}/9 đã phân công</div>
    </div>`;

  if (sel) {
    const sc = SLOT_COLORS.find(c => c.key === sel.colorKey);
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:rgba(47,111,237,.08);border:1px solid rgba(47,111,237,.3);font-size:12px">
      <span style="width:10px;height:10px;border-radius:50%;background:${sc.hex};box-shadow:0 0 8px ${sc.hex};display:inline-block;flex-shrink:0"></span>
      <span>Chọn nhân viên bên dưới để gán vào đèn <strong style="color:${sc.hex}">${sc.label}</strong> — Khu vực <strong style="color:var(--accent)">${sel.zoneId}</strong></span>
      <button onclick="cancelPickSlot()" style="margin-left:auto;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;font-family:var(--mono)">✕ Huỷ</button>
    </div>`;
  }

  // Zone cards — 3 fixed color slots each
  html += `<div class="zone-assign-grid">`;
  ZONES.forEach(z => {
    const za = state.zoneAssignments[z.id] || {};
    const filledCount = SLOT_COLORS.filter(c => za[c.key]).length;
    const binCount = (z.floors || 1) * (z.racksPerFloor || 1) * (z.binsPerRack || 0);
    const isSelZone = sel && sel.zoneId === z.id;

    html += `<div class="zone-assign-card${isSelZone ? ' selecting' : ''}">
      <div class="zone-assign-header">
        <div class="zone-color-bar" style="background:${z.color}"></div>
        <div>
          <div class="zone-assign-title">${z.name}</div>
          <div class="zone-assign-sub">${binCount} ngăn · ${filledCount}/3 slot đã gán</div>
        </div>
      </div>
      <div class="worker-slots">`;

    SLOT_COLORS.forEach(sc => {
      const code = za[sc.key];
      const w = code ? WORKERS_POOL.find(x => x.code === code) : null;
      const isSelSlot = sel && sel.zoneId === z.id && sel.colorKey === sc.key;

      if (w) {
        html += `<div class="worker-slot-filled" style="${isSelSlot ? `border-color:${sc.hex}` : ''}">
          <div class="wdot" style="background:${sc.hex};box-shadow:0 0 5px ${sc.hex}"></div>
          <div style="flex:1;min-width:0">
            <div class="wname">${w.name}</div>
            <div class="wcode">${w.code}</div>
          </div>
          <span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:${sc.hex}22;color:${sc.hex};white-space:nowrap">${sc.label}</span>
          <button class="wremove" onclick="removeWorkerFromSlot('${z.id}','${sc.key}')" title="Gỡ">×</button>
        </div>`;
      } else {
        html += `<div class="worker-slot-empty${isSelSlot ? ' selecting-target' : ''}"
          onclick="startPickSlot('${z.id}','${sc.key}')"
          style="${isSelSlot ? `border-color:${sc.hex};color:${sc.hex};background:${sc.hex}11` : ''}">
          <span style="width:8px;height:8px;border-radius:50%;background:${sc.hex};opacity:${isSelSlot?1:.4};flex-shrink:0;display:inline-block"></span>
          <span>${sc.label} — Chưa gán</span>
        </div>`;
      }
    });

    html += `</div></div>`;
  });
  html += `</div>`;

  // Worker pool
  html += `<div class="pool-section">
    <div class="pool-title">Nhân viên chưa phân công (${pool.length})</div>
    <div class="pool-chips">`;

  if (pool.length === 0) {
    html += `<span class="pool-chip-empty">Tất cả nhân viên đã được phân công</span>`;
  } else {
    pool.forEach(w => {
      const isTarget = sel !== null;
      html += `<div class="pool-chip${isTarget ? ' selecting-target' : ''}" onclick="assignWorkerToSlot('${w.code}')">
        <div class="cdot" style="background:${w.color}"></div>
        <span class="cname">${w.name}</span>
        <span class="ccode">${w.code}</span>
      </div>`;
    });
  }

  html += `</div></div>`;

  // Action bar
  html += `<div style="display:flex;justify-content:flex-end;gap:12px;align-items:center">
    ${canStart
      ? `<span style="font-size:11px;color:var(--text-muted)">${totalAssigned} nhân viên sẵn sàng</span>
         <button class="btn btn-success" onclick="setScreen('vanhanh')">Bắt đầu Vận hành →</button>`
      : `<span style="font-size:11px;color:var(--text-muted)">Phân công ít nhất 1 nhân viên để tiếp tục</span>
         <button class="btn" style="background:var(--surface2);color:var(--text-muted);cursor:not-allowed;opacity:.5" disabled>Bắt đầu Vận hành →</button>`
    }
  </div>`;

  el.innerHTML = html;
}

function startNewSession() {
  if (state.simTimer) clearInterval(state.simTimer);
  state.opsStep            = 0;
  state.simRunning         = false;
  state.simTimer           = null;
  state.simDone            = false;
  state.workerActive       = [false, false, false];
  state.workerCurrentSku   = [null, null, null];
  state.workerRoundsDone   = [0, 0, 0];
  state.workerDone         = [false, false, false];
  state.skuStatus          = SKUS.map(() => 'pool');
  disarmSlot(); // armedSlot = null + hủy hẹn giờ tự nhả
  state.confirmed          = [new Array(STORES.length).fill(false), new Array(STORES.length).fill(false), new Array(STORES.length).fill(false)];
  state.workerZoneIdx      = [{ A:0 }, { A:0 }, { A:0 }];
  state.workerZoneDone     = [{ A:false }, { A:false }, { A:false }];
  state.distributed        = Array.from({length: SKUS.length}, () => new Array(STORES.length).fill(0));
  state.editPlan           = Array.from({length: SKUS.length}, (_, si) => [...PLAN[si]]);
  state.zoneAssignments    = {
    A: { yellow: null, red: null, green: null },
  };
  state.selectingSlot = null;
  setScreen('phancong');
}

/* ═══════════════════════════════════════════════════════════
   SCREEN 5: VẬN HÀNH
═══════════════════════════════════════════════════════════ */
function renderVanHanh(el) {
  // Full-height container
  const wrap = document.createElement('div');
  wrap.id = 'ops-outer';
  wrap.style.cssText = `
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 0;
    height: calc(100vh - 52px);
    padding: 12px;
    gap: 12px;
    box-sizing: border-box;
  `;
  wrap.innerHTML = `
    <div id="ops-sidebar" style="
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow-y:auto;
    "></div>
    <div id="led-board" style="
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:16px;
    "></div>
  `;
  el.appendChild(wrap);
  renderOpsSidebar();
  renderLEDBoard();
}

/* ─── OPS SIDEBAR ─── */
function renderOpsSidebar() {
  const sb = document.getElementById('ops-sidebar');
  if (!sb) return;

  const step = state.opsStep;

  function slotCheckinLabel(colorKey) {
    const sc = SLOT_COLORS.find(c => c.key === colorKey);
    const ws = getWorkersForSlot(colorKey);
    const names = ws.length > 0 ? ws.map(w => w.name.split(' ').pop()).join(', ') : '(chưa phân)';
    return `${names} — đèn ${sc.label} quét thẻ vào`;
  }

  const stepDefs = [
    'Chuẩn bị ca',
    slotCheckinLabel('yellow'),
    slotCheckinLabel('red'),
    slotCheckinLabel('green'),
    'Khởi động phiên',
    'Đang vận hành',
  ];

  let html = `<div class="ops-section-label">Trạng thái phiên</div>`;

  // Nguồn sự kiện: 2 nút chọn rõ ràng (nút sáng = chế độ đang chạy)
  html += `
    <div class="scan-mode-row">
      <span class="scan-mode-label">Nguồn sự kiện</span>
      <div style="display:flex;gap:4px">
        <button class="scan-mode-btn ${!state.scanMode ? 'on' : ''}" onclick="setScanMode(false)">▷ Mô phỏng</button>
        <button class="scan-mode-btn ${state.scanMode ? 'on' : ''}" onclick="setScanMode(true)">⌁ Máy quét</button>
      </div>
    </div>`;

  // Step track
  html += `<div class="step-track">`;
  stepDefs.forEach((s, i) => {
    const isDone   = i < step;
    const isActive = i === step;
    html += `
      <div class="step-row ${isDone ? 's-done' : ''} ${isActive ? 's-active' : ''}">
        <div class="step-dot"></div>
        <div class="step-text">${s}</div>
      </div>
    `;
  });
  html += `</div>`;

  // Per-worker cards (one card per assigned worker, grouped by zone)
  html += `<div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);padding:6px 0 2px;border-top:1px solid var(--border)">Nhân viên</div>`;

  // Build flat list: all assigned workers across all zones
  const allWorkerCards = [];
  ZONES.forEach(z => {
    SLOT_COLORS.forEach((sc, slot) => {
      const code = state.zoneAssignments[z.id] && state.zoneAssignments[z.id][sc.key];
      if (!code) return;
      const w = WORKERS_POOL.find(x => x.code === code);
      if (w) allWorkerCards.push({ w, sc, slot, zoneId: z.id, zoneName: z.name, zoneColor: z.color });
    });
  });

  if (allWorkerCards.length === 0) {
    html += `<div style="font-size:11px;color:var(--text-subtle);font-style:italic;padding:6px 0">Chưa phân công nhân viên</div>`;
  }

  allWorkerCards.forEach(({ w, sc, slot, zoneId, zoneName, zoneColor }) => {
    const isActive   = state.workerActive[slot];
    const isDone     = state.workerDone[slot];
    const skuIdx     = getWorkerCurrentSkuIdx(slot);
    const isIdle     = isActive && !isDone && skuIdx === null; // rảnh, chờ nhận thùng
    const isArmed    = state.armedSlot === slot;
    const sku        = (isActive && !isDone && skuIdx !== null) ? SKUS[skuIdx] : null;
    const roundsDone = state.workerRoundsDone[slot];
    const zoneIndices = getZoneStoreIndices(zoneId);
    const zoneSize   = zoneIndices.length;
    const zoneDoneFlag = state.workerZoneDone[slot][zoneId];
    const localIdx   = state.workerZoneIdx[slot][zoneId];
    const confirmedInZone = zoneIndices.filter(gi => state.confirmed[slot][gi]).length;
    const progressPct = sku ? Math.round((confirmedInZone / zoneSize) * 100) : 0;

    let statusLine = 'Chưa vào ca';
    if (!isActive) statusLine = 'Chưa vào ca';
    else if (isDone) statusLine = '✓ Hoàn thành ca';
    else if (isIdle) {
      if (isArmed)              statusLine = '⌁ Quét tem thùng SKU để nhận việc…';
      else if (state.scanMode)  statusLine = '⌁ Rảnh — quét thẻ rồi quét thùng';
      else if (state.opsStep < 5) statusLine = 'Đã vào ca — chờ khởi động phiên';
      else statusLine = 'Chờ nhận SKU…';
    }
    else if (zoneDoneFlag) statusLine = `✓ ${zoneName} xong — chờ`;
    else if (sku) statusLine = `Bin ${localIdx + 1}/${zoneSize}`;

    // "Đèn" của ô nhân viên: sáng mạnh khi giơ tay, sáng thường khi đang chia,
    // tắt khi rảnh (vd vừa hủy giơ tay hoặc bị tự nhả) — chỉ còn viền màu nhạt
    const isWorking   = !!sku;
    const isLit       = isArmed || isWorking;
    const borderColor = (isActive && !isDone) ? (isLit ? sc.hex : hex2rgba(sc.hex, 0.4)) : 'var(--border)';
    const glowStyle   = isLit ? `box-shadow:0 0 ${isArmed ? 14 : 8}px ${hex2rgba(sc.hex, isArmed ? 0.45 : 0.25)};` : '';

    html += `
      <div class="worker-card" style="border-color:${borderColor};${glowStyle}padding:8px">
        <div class="worker-top">
          <div class="worker-color-dot" style="background:${sc.hex};box-shadow:0 0 5px ${sc.hex}99"></div>
          <div class="worker-name" style="font-size:11px">${w.name.split(' ').slice(-1)[0]}</div>
          <span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${sc.hex}22;color:${sc.hex};font-weight:700">${sc.label}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
          <span class="worker-code">${w.code}</span>
          <span style="font-size:9px;padding:1px 6px;border-radius:3px;background:${zoneColor}22;color:${zoneColor};font-weight:600">📍 ${zoneName}</span>
        </div>
        ${sku ? `<div class="worker-sku" style="color:${sc.hex};font-size:10px;margin-top:3px">${sku.code}</div>` : ''}
        <div class="worker-status" style="margin-top:2px">${statusLine}</div>
        ${isActive && !isDone ? `
          <div class="worker-progress-bar" style="margin-top:4px">
            <div class="worker-progress-fill" style="width:${progressPct}%;background:${sc.hex}"></div>
          </div>
          <div style="font-size:9px;color:var(--text-subtle)">${sku ? `${confirmedInZone}/${zoneSize} bins · ` : ''}${roundsDone} thùng xong</div>
        ` : ''}
      </div>
    `;
  });

  // Action area
  html += `<div style="margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:8px">`;

  if (state.simDone) {
    html += `
      <div style="font-size:11px;color:var(--green);text-align:center;padding:8px;background:rgba(65,191,88,.1);border:1px solid rgba(65,191,88,.25);border-radius:6px;font-weight:600">
        ✓ Phiên hoàn thành!
      </div>
      <button class="btn btn-success" style="width:100%;font-size:11px" onclick="setScreen('baocao')">Xem Báo cáo →</button>
      <button class="btn btn-primary" style="width:100%;font-size:11px" onclick="startNewSession()">↩ Phiên phân hàng tiếp theo</button>
    `;
  } else if (state.simRunning) {
    const anyIdle = [0,1,2].some(s => state.workerActive[s] && !state.workerDone[s] && state.workerCurrentSku[s] === null);
    const armed = state.armedSlot !== null;
    html += `
      <div class="sim-status">
        <div class="sim-dot"></div>
        <span>Đang vận hành…</span>
      </div>
    `;
    if (state.scanMode && armed) {
      html += `<div class="scan-wait-hint">⌁ Bước 2/2: quét tem thùng SKU để nhận việc</div>`;
    } else if (state.scanMode && anyIdle) {
      html += `<div class="scan-wait-hint">⌁ Bước 1/2: quét thẻ nhân viên đang rảnh</div>`;
    }
  } else {
    if (step <= 2) {
      if (state.scanMode) {
        html += `<div class="scan-wait-hint">⌁ Chờ quét thẻ nhân viên…</div>`;
      } else {
        const nextSlot = state.workerActive.indexOf(false);
        const sc = SLOT_COLORS[nextSlot === -1 ? 0 : nextSlot];
        const ws = getWorkersForSlot(sc.key);
        const names = ws.length > 0
          ? ws.map(w => w.name.split(' ').pop()).join(' & ')
          : `(đèn ${sc.label} chưa phân)`;
        html += `<button class="btn btn-primary" style="width:100%;font-size:11px;padding:10px" onclick="opsAdvance()">${names} quét thẻ →</button>`;
      }
    } else if (step === 3) {
      html += `<button class="btn btn-primary" style="width:100%;font-size:11px;padding:10px" onclick="opsAdvance()">▶ Bắt đầu phiên làm việc</button>`;
      if (state.scanMode) html += `<div class="scan-wait-hint">⌁ Hoặc quét tem thùng SKU — phiên tự khởi động</div>`;
    } else if (step === 4) {
      html += `<button class="btn btn-primary" style="width:100%;font-size:11px;padding:10px" onclick="opsAdvance()">▶ Nhân viên bắt đầu phân hàng${state.scanMode ? ' (quét thẻ → quét thùng)' : ''}</button>`;
      if (state.scanMode) html += `<div class="scan-wait-hint">⌁ Hoặc quét tem thùng SKU — phiên tự khởi động</div>`;
    }
  }

  html += `</div>`;
  sb.innerHTML = html;
}

/* ─── OPS ADVANCE STEPS ─── */
function opsAdvance() {
  const step = state.opsStep;
  if (step <= 2) {
    // Check-in thủ công: kích hoạt slot đầu tiên chưa vào ca
    // (quét thẻ có thể check-in không theo thứ tự nên opsStep = số người đã vào ca)
    const idx = state.workerActive.indexOf(false);
    if (idx !== -1) state.workerActive[idx] = true;
    state.opsStep = Math.min(3, state.workerActive.filter(Boolean).length);
  } else if (step === 3) {
    // All workers checked in — show SKUs activated
    state.opsStep = 4;
  } else if (step === 4) {
    state.opsStep = 5;
    state.simRunning = true;
    // Nhân viên khởi đầu đều rảnh (workerCurrentSku = null):
    // máy quét thật → quét thẻ + thùng để nhận việc; mô phỏng → simTick tự bốc SKU
    startSimulation();
  }
  renderOpsSidebar();
  renderLEDBoard();
}

/* ─── SIMULATION ─── */
function startSimulation() {
  state.simTimer = setInterval(simTick, 700);
}

function simTick() {
  // Mô phỏng: nhân viên rảnh tự bốc SKU tiếp theo còn trong pool
  if (!state.scanMode) {
    [0,1,2].forEach(slot => {
      if (!state.workerActive[slot] || state.workerDone[slot]) return;
      if (state.workerCurrentSku[slot] !== null) return;
      const next = state.skuStatus.indexOf('pool');
      if (next !== -1) claimSku(slot, next);
    });
    settleIdleWorkers();
  }

  // Phiên kết thúc khi mọi SKU đã chia xong
  if (checkSessionEnd()) return;

  // Máy quét thật: từng ngăn do nhân viên bấm đèn xác nhận (confirmBinClick), không tự chạy
  if (state.scanMode) return;

  // Build eligible (slot, zoneId) pairs: assigned worker exists + active + đang giữ SKU + zone not finished
  const eligiblePairs = [];
  [0,1,2].forEach(slot => {
    if (!state.workerActive[slot] || state.workerDone[slot] || state.workerCurrentSku[slot] === null) return;
    ZONES.forEach(z => {
      const code = state.zoneAssignments[z.id] && state.zoneAssignments[z.id][SLOT_COLORS[slot].key];
      if (!code) return;
      if (state.workerZoneDone[slot][z.id]) return;
      eligiblePairs.push({ slot, zoneId: z.id });
    });
  });

  if (eligiblePairs.length === 0) return; // mọi người đều đang chờ nhận thùng

  // Pick random eligible (slot, zone) pair
  const { slot, zoneId } = eligiblePairs[Math.floor(Math.random() * eligiblePairs.length)];
  confirmCurrentBin(slot, zoneId);
}

// Mọi SKU đã 'done' → chốt phiên
function checkSessionEnd() {
  if (!state.skuStatus.every(st => st === 'done')) return false;
  if (state.simTimer) clearInterval(state.simTimer);
  state.simRunning = false;
  state.simDone = true;
  [0,1,2].forEach(s => { if (state.workerActive[s]) state.workerDone[s] = true; });
  renderOpsSidebar();
  renderLEDBoard();
  return true;
}

// Xác nhận ngăn hiện tại của (slot, zone): mô phỏng gọi tự động, máy quét thật gọi khi bấm đèn
function confirmCurrentBin(slot, zoneId) {
  const zoneIndices = getZoneStoreIndices(zoneId);
  const localIdx = state.workerZoneIdx[slot][zoneId];
  const globalStoreIdx = zoneIndices[localIdx];

  // Mark bin confirmed + record distribution
  state.confirmed[slot][globalStoreIdx] = true;
  const skuIdx = getWorkerCurrentSkuIdx(slot);
  if (skuIdx !== null) {
    state.distributed[skuIdx][globalStoreIdx] = state.editPlan[skuIdx][globalStoreIdx];
  }

  if (localIdx < zoneIndices.length - 1) {
    // Advance within zone
    state.workerZoneIdx[slot][zoneId]++;
  } else {
    // This zone finished for current SKU round
    state.workerZoneDone[slot][zoneId] = true;

    // Check if ALL assigned zones for this slot are done
    const allZonesDone = ZONES.every(z => {
      const code = state.zoneAssignments[z.id] && state.zoneAssignments[z.id][SLOT_COLORS[slot].key];
      return !code || state.workerZoneDone[slot][z.id];
    });

    if (allZonesDone) {
      // Chia xong thùng SKU này → 'done', nhân viên rảnh chờ nhận thùng mới
      const doneSku = state.workerCurrentSku[slot];
      if (doneSku !== null) state.skuStatus[doneSku] = 'done';
      state.workerCurrentSku[slot] = null;
      state.workerRoundsDone[slot]++;
      settleIdleWorkers();
      if (checkSessionEnd()) return;
    }
  }
  renderOpsSidebar();
  renderLEDBoard();
}

// Máy quét thật: nhân viên bấm vào đèn của ngăn = nút xác nhận trên module đèn thật
function confirmBinClick(slot, storeIdx) {
  if (!state.scanMode || !state.simRunning) return;
  if (!state.workerActive[slot] || state.workerCurrentSku[slot] === null) return;
  const zoneId = STORES[storeIdx].zone;
  const zoneIndices = getZoneStoreIndices(zoneId);
  const localIdx = state.workerZoneIdx[slot][zoneId];
  if (state.workerZoneDone[slot][zoneId] || zoneIndices[localIdx] !== storeIdx || state.confirmed[slot][storeIdx]) {
    return scanFeedback('warn', 'Chưa đến lượt ngăn này');
  }
  const sku = SKUS[state.workerCurrentSku[slot]];
  confirmCurrentBin(slot, zoneId);
  scanFeedback('ok', `✓ ${STORES[storeIdx].id} — đã bỏ ${sku.code}`);
}

/* ═══════════════════════════════════════════════════════════
   SCANNER — máy quét mã vạch/QR (chế độ USB HID keyboard wedge)
   Máy quét "gõ" chuỗi ký tự rất nhanh rồi kết thúc bằng Enter.
   Luồng nhận việc: quét thẻ nhân viên (chọn người) → quét tem thùng
   SKU (người đó nhận thùng, đèn sáng). Không gán cứng SKU cho ai.
   Test tay không cần máy quét: gõ handleScan('NV-2207') trong Console.
═══════════════════════════════════════════════════════════ */
(function initScanListener() {
  const GAP_MS = 100;  // khoảng lặng giữa 2 phím lớn hơn mức này → coi như chuỗi mới
  const MIN_LEN = 4;
  let buf = '', lastKey = 0, flushTimer = null;
  window.addEventListener('keydown', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (e.repeat) return;
    const now = Date.now();
    if (now - lastKey > GAP_MS) buf = '';
    lastKey = now;
    clearTimeout(flushTimer);
    if (e.key === 'Enter') {
      if (buf.length >= MIN_LEN) handleScan(buf);
      buf = '';
      return;
    }
    if (e.key === 'Backspace') {
      // Bộ gõ tiếng Việt hợp ký tự bằng cách xóa-gõ lại (W → Backspace + Ư):
      // phải trừ buffer theo, không thì chuỗi bị lặp ký tự đã xóa
      buf = buf.slice(0, -1);
    } else if (e.key.length === 1) {
      buf += e.key;
    }
    // Máy quét không cấu hình suffix Enter: tự chốt chuỗi sau khoảng lặng
    if (buf.length >= MIN_LEN) {
      flushTimer = setTimeout(() => { handleScan(buf); buf = ''; }, GAP_MS + 60);
    }
  });
})();

function setScanMode(on) {
  if (state.scanMode === on) return; // bấm lại nút đang sáng → không làm gì
  toggleScanMode();
}

function toggleScanMode() {
  state.scanMode = !state.scanMode;
  disarmSlot();
  try { localStorage.setItem('ptl-scanMode', state.scanMode ? '1' : '0'); } catch (e) {}
  if (state.scanMode) {
    // Vừa chuyển sang máy quét thật giữa phiên: SKU nào mô phỏng đã tự gán
    // nhưng chưa chia được ngăn nào → trả về pool để quét thẻ + thùng nhận lại
    let released = false;
    [0,1,2].forEach(s => {
      const idx = state.workerCurrentSku[s];
      if (idx === null) return;
      if (!state.confirmed[s].some(Boolean)) {
        state.skuStatus[idx] = 'pool';
        state.workerCurrentSku[s] = null;
        released = true;
      }
    });
    if (released) {
      [0,1,2].forEach(s => {
        if (state.workerActive[s] && state.workerCurrentSku[s] === null) state.workerDone[s] = false;
      });
    }
  }
  // Về mô phỏng: simTick sẽ tự bốc SKU trong pool cho người đang rảnh
  renderOpsSidebar();
  renderLEDBoard();
}

// Router: nhận chuỗi máy quét trả về, phân loại theo pattern mã
function handleScan(raw) {
  // Bộ gõ tiếng Việt (Telex) có thể biến đổi phím máy quét gõ vào
  // (W→Ư, DD→Đ, AA→Â…) — đảo ngược các biến đổi này trước khi so mã
  const code = raw.trim().toUpperCase()
    .replace(/Ư/g, 'W')
    .replace(/Đ/g, 'DD')
    .replace(/Â/g, 'AA')
    .replace(/Ê/g, 'EE')
    .replace(/Ô/g, 'OO');

  const worker = WORKERS_POOL.find(w => w.code.toUpperCase() === code);
  if (worker) return handleBadgeScan(worker);

  const skuIdx = SKUS.findIndex(s => s.code.toUpperCase() === code);
  if (skuIdx !== -1) return handleSkuScan(skuIdx);

  scanFeedback('err', `Mã không hợp lệ: ${code}`);
}

// Quét thẻ nhân viên:
//  - chưa vào ca → check-in
//  - đã vào ca + phiên đang chạy + đang rảnh → "giơ tay" (armed), chờ quét thùng để nhận việc
function handleBadgeScan(worker) {
  if (state.screen !== 'vanhanh') {
    return scanFeedback('warn', `${worker.name}: mở màn hình Vận hành để check-in`);
  }
  if (state.simDone) return scanFeedback('warn', 'Phiên đã kết thúc');

  const slot = findSlotForWorkerCode(worker.code);
  if (slot === -1) return scanFeedback('err', `${worker.name} chưa được phân công khu vực`);

  // Khóa cặp thẻ → thùng: đang có người giơ tay chờ quét thùng
  if (state.armedSlot !== null) {
    if (state.armedSlot === slot) {
      // Quét lại chính thẻ mình → hủy giơ tay
      disarmSlot();
      scanFeedback('warn', `Đã hủy — ${worker.name} không nhận thùng`);
      renderOpsSidebar();
      return;
    }
    const armedWs = getWorkersForSlot(SLOT_COLORS[state.armedSlot].key);
    const armedName = armedWs.length ? armedWs[0].name : 'người trước';
    return scanFeedback('err', `Đang chờ ${armedName} quét thùng — quét lại thẻ ${armedName} để hủy`);
  }

  if (state.workerActive[slot]) {
    // Đã vào ca — lần quét thẻ này là để nhận thùng
    if (state.workerDone[slot]) return scanFeedback('warn', `${worker.name} đã xong ca`);
    if (state.workerCurrentSku[slot] !== null) {
      return scanFeedback('warn', `${worker.name} đang chia ${SKUS[state.workerCurrentSku[slot]].code}, chưa nhận thùng mới được`);
    }
    if (!state.skuStatus.some(st => st === 'pool')) return scanFeedback('warn', 'Hết thùng SKU để nhận');
    armSlot(slot);
    scanFeedback('ok', `⌁ ${worker.name}: quét tem thùng SKU để nhận việc`);
    renderOpsSidebar();
    return;
  }

  // Check-in vào ca — ở chế độ máy quét thì "giơ tay" luôn: quét thùng ngay sau là nhận việc
  state.workerActive[slot] = true;
  if (state.opsStep <= 3) {
    state.opsStep = Math.min(3, state.workerActive.filter(Boolean).length);
  }
  if (state.scanMode) {
    armSlot(slot);
    scanFeedback('ok', `✓ ${worker.name} vào ca — quét tem thùng SKU để nhận việc`);
  } else {
    scanFeedback('ok', `✓ ${worker.name} vào ca — đèn ${SLOT_COLORS[slot].label}`);
  }
  renderOpsSidebar();
  renderLEDBoard();
}

// Tìm slot màu LED mà nhân viên (theo mã thẻ) được phân công
function findSlotForWorkerCode(code) {
  for (const z of [...ZONES, ...state.extraZones]) {
    const za = state.zoneAssignments[z.id];
    if (!za) continue;
    for (let slot = 0; slot < SLOT_COLORS.length; slot++) {
      if ((za[SLOT_COLORS[slot].key] || '') === code) return slot;
    }
  }
  return -1;
}

// Quét tem thùng SKU → gán thùng cho nhân viên vừa quét thẻ (armed) và mở vòng phân hàng.
// Thùng đầu tiên được quét sẽ tự khởi động phiên — không cần bấm nút.
function handleSkuScan(skuIdx) {
  const sku = SKUS[skuIdx];
  if (state.screen !== 'vanhanh') {
    return scanFeedback('warn', `${sku.code}: mở màn hình Vận hành trước`);
  }
  if (!state.scanMode && state.opsStep < 5) {
    return scanFeedback('warn', `${sku.code}: phiên chưa vận hành, chưa cần quét thùng`);
  }
  if (state.skuStatus[skuIdx] === 'done') {
    return scanFeedback('warn', `${sku.code} đã phân xong`);
  }
  if (state.skuStatus[skuIdx] === 'active') {
    const holder = state.workerCurrentSku.indexOf(skuIdx);
    const ws = holder !== -1 ? getWorkersForSlot(SLOT_COLORS[holder].key) : [];
    const who = ws.length ? ws.map(w => w.name.split(' ').pop()).join(' & ') : 'người khác';
    return scanFeedback('warn', `${sku.code} đang được ${who} phân hàng`);
  }
  if (state.armedSlot === null) {
    return scanFeedback('err', `Quét thẻ nhân viên trước, rồi quét thùng ${sku.code}`);
  }

  const slot = state.armedSlot;
  disarmSlot();
  // Quét thùng đầu tiên khi phiên chưa chạy → tự khởi động phiên
  if (!state.simRunning && !state.simDone) {
    state.opsStep = 5;
    state.simRunning = true;
    startSimulation();
  }
  claimSku(slot, skuIdx);
  const ws = getWorkersForSlot(SLOT_COLORS[slot].key);
  const names = ws.length ? ws.map(w => w.name.split(' ').pop()).join(' & ') : `đèn ${SLOT_COLORS[slot].label}`;
  scanFeedback('ok', `✓ ${sku.code} — ${names} bắt đầu phân hàng`);
  renderOpsSidebar();
  renderLEDBoard();
}

/* ─── Scan feedback: toast + beep ─── */
let scanToastTimer = null;
function scanFeedback(type, msg) {
  scanBeep(type);
  let el = document.getElementById('scan-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'scan-toast';
    document.body.appendChild(el);
  }
  el.className = `scan-toast ${type}`;
  el.textContent = msg;
  clearTimeout(scanToastTimer);
  scanToastTimer = setTimeout(() => { el.className = 'scan-toast hide'; }, 2500);
}

let scanAudioCtx = null;
function scanBeep(type) {
  try {
    scanAudioCtx = scanAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc  = scanAudioCtx.createOscillator();
    const gain = scanAudioCtx.createGain();
    osc.connect(gain);
    gain.connect(scanAudioCtx.destination);
    osc.frequency.value = type === 'ok' ? 1200 : type === 'warn' ? 600 : 220;
    gain.gain.value = 0.08;
    osc.start();
    osc.stop(scanAudioCtx.currentTime + (type === 'ok' ? 0.09 : 0.25));
  } catch (e) { /* không có audio cũng không sao */ }
}

/* ─── LED BOARD ─── */
function renderLEDBoard() {
  const board = document.getElementById('led-board');
  if (!board) return;

  const step = state.opsStep;
  const sessionStarted = step >= 4; // SKUs activated at step 4+

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--text)">Bảng LED điều phối</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">Thời gian thực — ${STORES.length} bin · 3 màu LED${state.scanMode ? ' · bấm đèn để xác nhận đã bỏ hàng' : ''}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        ${SLOT_COLORS.map(sc => `
          <span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;color:${sc.hex}">
            <span style="width:7px;height:7px;border-radius:50%;background:${sc.hex};box-shadow:0 0 5px ${sc.hex};display:inline-block"></span>
            ${sc.label}
          </span>
        `).join('')}
      </div>
    </div>
  `;

  ZONES.forEach(zone => {
    const zoneStores = STORES.map((s, i) => ({...s, storeIdx: i})).filter(s => s.zone === zone.id);
    html += `
      <div class="zone-section">
        <div class="zone-label">
          <div class="zone-dot" style="background:${zone.color};box-shadow:0 0 5px ${zone.color}88"></div>
          <span style="color:${zone.color}">${zone.name}</span>
        </div>
        <div class="zone-bins">
    `;
    zoneStores.forEach(store => {
      html += buildBinCard(store, zone, sessionStarted);
    });
    html += `</div></div>`;
  });

  board.innerHTML = html;
}

function buildBinCard(store, zone, sessionStarted) {
  const si = store.storeIdx;

  // Compute per-slot LED state — only lights up if a worker is assigned to this color IN this zone
  const storeZoneId = store.zone;
  const zoneStoreIndices = getZoneStoreIndices(storeZoneId);

  const slots = SLOT_COLORS.map((sc, slot) => {
    if (!state.workerActive[slot]) return { sc, slot, state: 'inactive' };
    if (state.workerDone[slot])    return { sc, slot, state: 'inactive' };
    if (!sessionStarted)           return { sc, slot, state: 'inactive' };

    // Only light if a worker is assigned to this color in this bin's zone
    const code = state.zoneAssignments[storeZoneId] && state.zoneAssignments[storeZoneId][sc.key];
    if (!code) return { sc, slot, state: 'inactive' };

    const skuIdx = getWorkerCurrentSkuIdx(slot);
    if (skuIdx === null)           return { sc, slot, state: 'inactive' }; // rảnh — chưa nhận thùng

    const qty = state.editPlan[skuIdx][si];
    const isConfirmed = state.confirmed[slot][si];

    // Current bin: zone must not be done AND localIdx maps to this store
    const zoneDone = state.workerZoneDone[slot][storeZoneId];
    const localIdx = state.workerZoneIdx[slot][storeZoneId];
    const isCurrentBin = !zoneDone && zoneStoreIndices[localIdx] === si && !isConfirmed && state.simRunning;

    return {
      sc, slot, skuIdx, qty,
      isConfirmed,
      isCurrentBin,
      state: 'lit',
    };
  });

  // Check if any slot is currently processing THIS bin
  const confirmingSlot = slots.find(s => s.state === 'lit' && s.isCurrentBin);

  let cardStyle = '';
  let badgeHtml = '';
  if (confirmingSlot) {
    const cc = confirmingSlot.sc.hex;
    cardStyle = `border-color:${cc};box-shadow:0 0 14px ${hex2rgba(cc,.35)},0 0 30px ${hex2rgba(cc,.12)};`;
    badgeHtml = `<div class="bin-badge" style="background:${hex2rgba(cc,.2)};color:${cc};border:1px solid ${hex2rgba(cc,.5)}">ĐANG PHÂN</div>`;
  }

  let html = `
    <div class="bin-card" style="${cardStyle}">
      <div class="bin-header">
        <div>
          <div class="bin-name">${store.id}</div>
          <div class="bin-subname">${store.id}</div>
        </div>
        <div class="bin-addr" style="color:${zone.color}">${store.addr}</div>
      </div>
      ${badgeHtml}
      <div class="led-slots">
  `;

  slots.forEach(slotData => {
    const { sc, state: slotState, skuIdx, qty, isConfirmed, isCurrentBin } = slotData;

    if (slotState === 'inactive') {
      html += `
        <div class="led-row unlit">
          <div class="led-dot" style="background:${sc.hex};opacity:.3"></div>
          <div class="led-sku" style="font-size:9px">—</div>
        </div>
      `;
      return;
    }

    const sku = SKUS[skuIdx];
    const rowCls = isConfirmed ? 'led-row lit confirmed' : isCurrentBin ? 'led-row lit led-active' : 'led-row lit';
    // Máy quét thật: đèn ngăn hiện tại là nút bấm xác nhận "đã bỏ hàng"
    const clickable = state.scanMode && isCurrentBin && !isConfirmed;

    html += `
      <div class="${rowCls}" ${clickable ? `onclick="confirmBinClick(${slotData.slot}, ${si})" title="Bấm xác nhận đã bỏ hàng vào ngăn"` : ''} style="
        ${clickable ? 'cursor:pointer;' : ''}
        --led-color:${sc.hex};
        --led-glow:${hex2rgba(sc.hex,.35)};
        --led-bg:${hex2rgba(sc.hex,.07)};
        --led-border:${hex2rgba(sc.hex,.25)};
        --led-active-bg:${hex2rgba(sc.hex,.15)};
        ${isCurrentBin ? `border-color:${hex2rgba(sc.hex,.5)};` : ''}
      ">
        <div class="led-dot" style="background:${sc.hex}"></div>
        <div class="led-sku">${sku.code}</div>
        <div class="led-qty">${qty}</div>
        <div class="led-unit">sp</div>
        <div class="led-check">✓</div>
      </div>
    `;
  });

  html += `</div></div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════
   SCREEN 6: BÁO CÁO
═══════════════════════════════════════════════════════════ */
function renderBaoCao(el) {
  const skuStats = SKUS.map((sku, si) => {
    const willDistrib  = getEditTotal(si);
    const distributed  = state.distributed[si].reduce((a, b) => a + b, 0);
    const surplusStock = sku.qty - willDistrib;   // dư kho = tiếp nhận - đã phân
    const remaining    = willDistrib - distributed; // chưa phân hết (nếu > 0)
    return { sku, si, willDistrib, distributed, surplusStock, remaining };
  });

  const totalDist    = skuStats.reduce((a, s) => a + s.distributed, 0);
  const totalSurplus = skuStats.reduce((a, s) => a + Math.max(0, s.surplusStock), 0);
  const completedSkus = skuStats.filter(s => s.remaining === 0).length;
  const surplusSkus  = skuStats.filter(s => s.surplusStock > 0);

  let html = `
    <div class="page-header">
      <div class="page-title">Báo cáo phiên làm việc</div>
      <div class="page-subtitle">Tổng kết kết quả phân hàng — ${new Date().toLocaleString('vi-VN')}</div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">SKU hoàn thành</div>
        <div class="stat-value" style="color:var(--green)">${completedSkus}/${SKUS.length}</div>
        <div class="stat-sub">mã hàng</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tổng đã phân</div>
        <div class="stat-value">${totalDist.toLocaleString()}</div>
        <div class="stat-sub">sản phẩm</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hàng dư kho</div>
        <div class="stat-value" style="color:${totalSurplus>0?'var(--yellow)':'var(--text-muted)'}">${totalSurplus.toLocaleString()}</div>
        <div class="stat-sub">${totalSurplus > 0 ? `${surplusSkus.length} mặt hàng dư` : 'không có'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nhân viên</div>
        <div class="stat-value">3</div>
        <div class="stat-sub">đã hoàn thành ca</div>
      </div>
    </div>`;

  // Surplus block — highlight if any
  if (surplusSkus.length > 0) {
    html += `<div style="border:1px solid rgba(255,176,31,.35);background:rgba(255,176,31,.06);border-radius:10px;padding:14px 16px;margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:10px">Hàng dư kho sau phiên làm việc</div>
      <table style="width:100%">
        <thead><tr>
          <th style="text-align:left;font-size:10px;color:var(--text-muted);padding:4px 8px">Mã SKU</th>
          <th style="text-align:left;font-size:10px;color:var(--text-muted);padding:4px 8px">Tên hàng</th>
          <th style="text-align:right;font-size:10px;color:var(--text-muted);padding:4px 8px">SL tiếp nhận</th>
          <th style="text-align:right;font-size:10px;color:var(--text-muted);padding:4px 8px">Đã phân</th>
          <th style="text-align:right;font-size:10px;color:var(--yellow);padding:4px 8px">Dư kho</th>
        </tr></thead>
        <tbody>
          ${surplusSkus.map(({ sku, distributed, surplusStock }) => `
            <tr>
              <td style="padding:4px 8px"><span class="mono" style="font-size:11px;color:var(--accent)">${sku.code}</span></td>
              <td style="padding:4px 8px;font-size:11px">${sku.name}</td>
              <td style="padding:4px 8px;text-align:right;font-size:11px">${sku.qty.toLocaleString()}</td>
              <td style="padding:4px 8px;text-align:right;font-size:11px;color:var(--green)">${distributed.toLocaleString()}</td>
              <td style="padding:4px 8px;text-align:right;font-size:12px;font-weight:700;color:var(--yellow)">+${surplusStock.toLocaleString()}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot><tr style="border-top:1px solid var(--border)">
          <td colspan="4" style="padding:6px 8px;font-size:11px;font-weight:700">Tổng dư kho</td>
          <td style="padding:6px 8px;text-align:right;font-size:12px;font-weight:800;color:var(--yellow)">+${totalSurplus.toLocaleString()} sp</td>
        </tr></tfoot>
      </table>
    </div>`;
  }

  html += `
    <div class="card">
      <div class="card-title">Tổng hợp theo SKU</div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã SKU</th>
              <th>Tên hàng</th>
              <th style="text-align:right">SL tiếp nhận</th>
              <th style="text-align:right">Đã phân</th>
              <th style="text-align:right">Dư kho</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody>`;

  skuStats.forEach(({ sku, distributed, surplusStock, remaining }) => {
    const isDone    = remaining === 0;
    const hasSurplus = surplusStock > 0;
    const label     = !isDone ? 'Chưa xong' : hasSurplus ? `Dư ${surplusStock.toLocaleString()} sp` : 'Hoàn thành';
    const cls       = !isDone ? 'badge-red' : hasSurplus ? 'badge-yellow' : 'badge-green';

    html += `<tr>
      <td><span class="mono" style="color:var(--accent)">${sku.code}</span></td>
      <td style="font-size:11px">${sku.name}</td>
      <td style="text-align:right">${sku.qty.toLocaleString()}</td>
      <td style="text-align:right;font-weight:700;color:var(--green)">${distributed.toLocaleString()}</td>
      <td style="text-align:right;font-weight:600;color:${hasSurplus?'var(--yellow)':'var(--text-muted)'}">
        ${hasSurplus ? '+'+surplusStock.toLocaleString() : '—'}
      </td>
      <td><span class="badge ${cls}">${label}</span></td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;

  // Per-store accordion
  html += `<div class="card"><div class="card-title">Chi tiết theo cửa hàng</div>`;

  skuStats.forEach(({ sku, si }) => {
    html += `
      <div class="accordion-item" id="acc-${si}">
        <div class="accordion-header" onclick="toggleAcc(${si})">
          <div class="accordion-title">
            <span class="mono" style="color:var(--accent)">${sku.code}</span>
            <span style="color:var(--text-muted);font-weight:400"> — ${sku.name}</span>
          </div>
          <span class="accordion-arrow">▼</span>
        </div>
        <div class="accordion-body">
          <table>
            <thead>
              <tr>
                <th>Cửa hàng</th>
                <th>Khu vực</th>
                <th style="text-align:right">KH</th>
                <th style="text-align:right">Đã phân</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>
    `;
    STORES.forEach((store, ci) => {
      const zone = ZONES.find(z => z.id === store.zone);
      const plan = state.editPlan[si][ci];
      const dist = state.distributed[si][ci];
      const ok = dist >= plan;
      html += `<tr>
        <td>${store.id}</td>
        <td style="color:${zone.color}">${zone.name}</td>
        <td style="text-align:right">${plan}</td>
        <td style="text-align:right;font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${dist}</td>
        <td><span class="badge ${ok?'badge-green':'badge-red'}">${ok?'OK':'Thiếu'}</span></td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  html += `</div>`;
  el.innerHTML = html;
}

function toggleAcc(idx) {
  const el = document.getElementById(`acc-${idx}`);
  if (el) el.classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
function init() {
  renderAll();
}

init();
</script>
</body>
</html>
